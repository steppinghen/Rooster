<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Coop TV</title>

<!-- iPad + iPhone home-screen / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coop TV">
<meta name="mobile-web-app-capable" content="yes">
<!-- Kid screens are dark; parent screens are warm. theme-color is
     swapped at runtime by ui.js render() to match the current screen. -->
<meta name="theme-color" content="#1A2230">
<meta name="color-scheme" content="dark">
<!-- Add a real apple-touch-icon.png (180x180) at site root when deployed -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Kid theme uses Outfit + Figtree; parent theme keeps Fredoka + Nunito loaded so it renders unchanged. -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Outfit:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<!-- Config (safe to ship — publishable key only) -->
<script src="config.js"></script>

<!-- supabase-js UMD, same version as the other rooster sites -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>

<!-- App modules -->
<script type="module" src="js/ui.js"></script>
</body>
</html>
