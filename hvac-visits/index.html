<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rounds — contractor visits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================================================= -->
<!-- AUTH GATE — load order matters: css, supabase, config, overlay. -->
<!-- Do NOT add `defer`: auth-overlay.js stamps .rooster-auth-pending -->
<!-- onto <html> as it parses, so gated content never paints.         -->
<!-- Deferring it would flash the Rounds app before the gate engages. -->
<!--                                                                  -->
<!-- The overlay hides every direct child of <body> until an allowed   -->
<!-- session is confirmed; it does NOT target #appShell by id, so the  -->
<!-- wrapper below needs no display:none of its own.                   -->
<!-- ============================================================= -->
<link rel="stylesheet" href="vendor/auth-overlay.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="auth-config.js"></script>
<script src="vendor/auth-overlay.js"></script>

<style>
  :root{
    --ink:#16232b; --bg:#eef2f3; --surface:#ffffff; --muted:#5f7079; --border:#dbe3e6;
    --teal:#1f7a8c; --teal-soft:#e3f0f2;
    --amber:#c67d10; --amber-soft:#fbeed3;
    --red:#cf4b3e; --red-soft:#f8e0dc;
    --radius:16px; --shadow:0 1px 2px rgba(22,35,43,.06),0 6px 18px rgba(22,35,43,.06); --tap:56px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  select{font-family:inherit}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
  a{color:inherit}

  .app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--border)}

  @media(min-width:900px){
    body{background:#dde5e7;padding:28px 0}
    .app{max-width:1120px;min-height:calc(100dvh - 56px);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(22,35,43,.16)}
    /* nav | list | detail */
    .split{display:grid;grid-template-columns:200px 400px 1fr;flex:1;min-height:0}
    .pane-list{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg);min-height:0}
    .pane-detail{overflow-y:auto;background:var(--bg)}
    .mobile-only{display:none !important}
    .fab-add{display:none !important}
    /* the bottom tab bar is a phone control; desktop uses .sidenav */
    .tabbar{display:none !important}
    /* Was never shown: the base .detail-placeholder{display:none} rule sits
       LATER in the sheet, and a media query adds no specificity — so this
       needs the extra class to win. */
    .pane-detail .detail-placeholder{display:flex}
    /* Map gets the whole content area — pane-detail is removed from the
       grid entirely so the list pane can span the remaining column. */
    .split[data-desk="map"]{grid-template-columns:200px 1fr}
    .split[data-desk="map"] .pane-detail{display:none}
    .split[data-desk="map"] .pane-list{border-right:none}
    /* sign-out badge moves out of its floating position into the header */
    .topbar #roosterAuthBadge{position:static;bottom:auto;right:auto;box-shadow:none;background:var(--bg);border:1px solid var(--border);backdrop-filter:none}
  }
  /* ── persistent desktop side navigation ───────────────────────── */
  .sidenav{display:none}
  @media(min-width:900px){
    .sidenav{display:flex;flex-direction:column;gap:3px;padding:14px 10px;background:var(--surface);border-right:1px solid var(--border);min-height:0}
    .snav-lbl{padding:4px 12px 8px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9fb0b6}
    .snav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:11px;color:var(--muted);font-size:14px;font-weight:600;text-align:left}
    .snav svg{width:20px;height:20px;flex:none}
    .snav:hover{background:var(--bg);color:var(--ink)}
    .snav[aria-current="true"]{background:var(--teal-soft);color:var(--teal)}
    .snav .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
    .snav[aria-current="true"] .cnt{color:var(--teal)}
  }
  @media(max-width:899px){
    .desktop-only{display:none !important}
    .split{display:flex;flex-direction:column;flex:1;min-height:0}
    .pane-detail{display:contents}
    .detail-placeholder{display:none !important}
  }

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:max(14px,env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--teal),#155c6a);display:grid;place-items:center;flex:none}
  .mark svg{width:18px;height:18px}
  .brand b{font-family:'Archivo';font-weight:800;font-size:19px;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-size:12px;font-weight:500;display:block;margin-top:-3px}
  .topbar .spacer{flex:1}
  .desktop-add{display:none}
  @media(min-width:900px){.desktop-add{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-family:'Archivo';font-weight:700;font-size:14px;padding:10px 16px;border-radius:11px}.desktop-add svg{width:18px;height:18px}}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:92px}
  @media(min-width:900px){.scroll{padding-bottom:20px}}

  .view{display:none}
  .view.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.view.active{animation:none}}

  .summary{padding:20px 18px 8px}
  .summary h1{font-family:'Archivo';font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .readout{display:flex;gap:10px;margin-top:12px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
  .stat .n{font-family:'Archivo';font-weight:800;font-size:32px;line-height:1;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:500}
  .stat .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .stat.hot .n{color:var(--red)} .stat.hot .bar{background:var(--red)}
  .stat.due .n{color:var(--amber)} .stat.due .bar{background:var(--amber)}
  .stat.cool .n{color:var(--teal)} .stat.cool .bar{background:var(--teal)}

  /* territory picker */
  .terrpick{padding:14px 18px 2px}
  .terrpick .sel{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:0 14px}
  .terrpick .sel svg.pin{width:19px;height:19px;color:var(--teal);flex:none}
  .terrpick select{appearance:none;-webkit-appearance:none;border:none;background:none;flex:1;font-size:16px;font-weight:600;color:var(--ink);padding:14px 0;outline:none;cursor:pointer}
  .terrpick .sel svg.chev{width:18px;height:18px;color:var(--muted);flex:none;pointer-events:none}
  .terrpick .cnt{font-size:12px;color:var(--muted);padding:8px 4px 0;font-weight:500}

  .sectionhdr{display:flex;align-items:center;gap:8px;padding:16px 18px 6px}
  .sectionhdr .lbl{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .sectionhdr .spacer{flex:1}
  .hint-swipe{font-size:12px;color:#9aa8ad;font-weight:500;display:flex;align-items:center;gap:5px}
  .hint-swipe svg{width:15px;height:15px}

  .searchbar{padding:16px 18px 4px}
  .searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
  .searchbox svg{width:20px;height:20px;color:var(--muted);flex:none}
  .searchbox input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:none;color:var(--ink)}
  .segrow{display:flex;gap:8px;padding:12px 18px 4px}
  .seg{flex:1;padding:10px 0;text-align:center;font-weight:600;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:11px}
  .seg[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}

  .list{padding:4px 12px 8px}
  .swipe{position:relative;margin:8px 0;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .swipe-actions{position:absolute;inset:0;display:flex;justify-content:flex-end}
  .swipe-actions button{width:50%;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:700;font-size:13px}
  .swipe-actions svg{width:22px;height:22px}
  .sa-visit{background:var(--teal)} .sa-update{background:#3a4d57}
  /* ── Desktop quick actions ─────────────────────────────────────
     There is no swipe gesture with a mouse, so the same two buttons the
     mobile swipe reveals are surfaced on hover instead. Identical markup
     and identical handlers (quickLog) — only the reveal differs.
     :focus-within is included so they are keyboard-reachable too. */
  @media(min-width:900px){
    .swipe-actions{inset:auto 12px auto auto;top:50%;transform:translateY(-50%);z-index:3;gap:7px;opacity:0;pointer-events:none;transition:opacity .12s ease}
    .swipe:hover .swipe-actions,.swipe:focus-within .swipe-actions{opacity:1;pointer-events:auto}
    .swipe-actions button{width:auto;max-width:none;flex-direction:row;gap:6px;padding:7px 11px;border-radius:10px;font-size:12px;box-shadow:0 3px 10px rgba(22,35,43,.22)}
    /* Fade the row content out behind the pills. Paints above .card (same
       z-index, later in tree order) but below .swipe-actions (z-index 3),
       so the labels stay legible over long company names. */
    .swipe::after{content:'';position:absolute;inset:1px 1px 1px auto;width:265px;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,var(--surface) 42%);opacity:0;transition:opacity .12s ease;pointer-events:none;z-index:2;border-radius:0 var(--radius) var(--radius) 0}
    .swipe:hover::after,.swipe:focus-within::after{opacity:1}
    .swipe-actions button:hover{filter:brightness(1.08)}
    .swipe-actions svg{width:16px;height:16px}
    /* the status badge sits exactly where the pills land — swap it out */
    .card-right{transition:opacity .12s ease}
    .swipe:hover .card-right,.swipe:focus-within .card-right{opacity:0}
  }
  .card{position:relative;z-index:2;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;width:100%;text-align:left;min-height:var(--tap);transition:transform .18s ease;will-change:transform}
  .card:active{filter:brightness(.985)}
  .card.selected{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
  .gauge{width:7px;flex:none}
  .gauge.hot{background:var(--red)} .gauge.due{background:var(--amber)} .gauge.cool{background:var(--teal)} .gauge.churn{background:#c9d2d5}
  .card-body{flex:1;padding:13px 14px 13px 15px;min-width:0}
  .card-topline{display:flex;align-items:center;gap:8px}
  .card-name{font-family:'Archivo';font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;flex:1;min-width:0}
  .terr-tag{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:3px 7px;border-radius:6px;flex:none;text-transform:uppercase}
  .card-person{font-size:13px;color:var(--ink);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-person .title{color:var(--muted);font-weight:500}
  .card-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .card-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:14px 16px 14px 6px;flex:none;border-left:1px solid var(--border)}
  .badge-n{font-family:'Archivo';font-weight:800;font-size:22px;line-height:1;letter-spacing:-.02em}
  .badge-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .hot .badge-n{color:var(--red)} .due .badge-n{color:var(--amber)} .cool .badge-n{color:var(--teal)}
  .emptynote{text-align:center;color:var(--muted);font-size:14px;padding:40px 24px;line-height:1.6}

  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  @media(min-width:900px){.tabbar{position:static}}
  .tab{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
  .tab svg{width:25px;height:25px}
  .tab span{font-size:11px;font-weight:600}
  .tab[aria-selected="true"]{color:var(--teal)}

  .detail-head{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 18px 18px}
  .backrow{display:flex;align-items:center;gap:6px;margin-bottom:14px}
  .back{display:flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;font-size:14px;padding:6px 8px 6px 4px;border-radius:8px}
  .back:hover{color:var(--ink)} .back svg{width:20px;height:20px}
  .backrow .spacer{flex:1}
  .status-pill{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 11px;border-radius:20px}
  .status-pill.hot{background:var(--red-soft);color:var(--red)}
  .status-pill.due{background:var(--amber-soft);color:#8a5606}
  .status-pill.cool{background:var(--teal-soft);color:#155c6a}
  .status-pill.churn{background:#eceff0;color:var(--muted)}
  .detail-name{font-family:'Archivo';font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1.1}
  .detail-person{font-size:16px;font-weight:600;margin-top:8px}
  .detail-person .title{color:var(--muted);font-weight:500}
  .detail-freq{color:var(--muted);font-size:13px;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .detail-terr{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--teal);background:var(--teal-soft);padding:3px 8px;border-radius:6px;text-transform:uppercase}

  .cta-row{display:flex;gap:10px;padding:16px 18px 4px}
  .cta{flex:1;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:9px;font-family:'Archivo';font-weight:700;font-size:16px}
  .cta svg{width:22px;height:22px}
  .cta-visit{background:var(--teal);color:#fff;box-shadow:0 8px 22px rgba(31,122,140,.28)}
  .cta-update{background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow)}
  .cta:active{transform:scale(.985)}

  .section{padding:18px 18px 4px}
  .section-title{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center}
  .section-title .spacer{flex:1}
  .section-title a{color:var(--teal);text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;font-family:'Inter'}

  .field{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .field-row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:var(--tap);text-decoration:none;color:inherit}
  .field-row + .field-row{border-top:1px solid var(--border)}
  .field-row .k{font-size:14px;color:var(--muted);width:76px;flex:none;font-weight:500}
  .field-row .v{font-size:15px;font-weight:500;flex:1;min-width:0;word-break:break-word}
  .field-row.link .v{color:var(--teal);font-weight:600}
  .field-row .go{color:var(--muted);flex:none} .field-row .go svg{width:20px;height:20px;display:block}
  .field-row .derived{font-size:11px;font-weight:700;color:#9aa8ad;letter-spacing:.03em;text-transform:uppercase;flex:none}

  .stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:11px;overflow:hidden;flex:none}
  .stepper button{width:44px;height:44px;font-size:22px;font-weight:600;color:var(--teal);display:grid;place-items:center}
  .stepper button:active{background:var(--teal-soft)}
  .stepper .val{min-width:96px;text-align:center;font-family:'Archivo';font-weight:700;font-size:15px;line-height:1.15}
  .stepper .val small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:var(--muted)}

  .toggle{position:relative;width:52px;height:31px;border-radius:20px;background:#cdd6d9;flex:none;transition:background .18s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
  .toggle[aria-pressed="true"]{background:var(--teal)}
  .toggle[aria-pressed="true"]::after{transform:translateX(21px)}
  @media(prefers-reduced-motion:reduce){.toggle,.toggle::after{transition:none}}

  .timeline{padding:2px 18px 24px}
  .tl{display:flex;gap:12px;padding:2px 0}
  .tl-rail{display:flex;flex-direction:column;align-items:center;flex:none;width:26px}
  .tl-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;z-index:2}
  .tl-dot svg{width:14px;height:14px;color:#fff}
  .tl-dot.visit{background:var(--teal)} .tl-dot.update{background:#3a4d57}
  .tl-line{width:2px;flex:1;background:var(--border);margin:2px 0}
  .tl-body{flex:1;padding-bottom:16px}
  .tl-kind{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .tl-kind.visit{color:var(--teal)} .tl-kind.update{color:#3a4d57}
  .tl-when{font-size:12px;color:var(--muted);margin-left:8px;font-weight:500}
  .tl-txt{font-size:14px;margin-top:5px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
  .tl-empty{color:var(--muted);text-align:center;font-size:14px;border:1px dashed var(--border);border-radius:13px;padding:18px}

  .form{padding:18px}
  .form h2{font-family:'Archivo';font-weight:800;font-size:22px;letter-spacing:-.01em;margin-bottom:4px}
  .form p.hint{color:var(--muted);font-size:14px;margin-bottom:18px}
  .grouplbl{font-family:'Archivo';font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
  .inp{margin-bottom:14px}
  .inp label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .inp input,.inp textarea{width:100%;padding:15px 16px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:13px}
  .inp input:focus,.inp textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .inp textarea{min-height:110px;resize:vertical}
  .inp .opt{color:#9aa8ad;font-weight:500}
  .two{display:flex;gap:10px}.two .inp{flex:1}
  .ac{position:relative}
  .ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 12px 30px rgba(22,35,43,.16);z-index:40;overflow:hidden;display:none}
  .ac-list.show{display:block}
  .ac-item{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
  .ac-item:last-child{border-bottom:none}
  .ac-item:hover{background:var(--teal-soft)}
  .ac-item svg{width:18px;height:18px;color:var(--muted);flex:none}
  .ac-item .main{font-size:15px;font-weight:600}
  .ac-item .sub{font-size:12px;color:var(--muted)}
  .ac-foot{padding:8px 14px;font-size:11px;color:#9aa8ad;display:flex;align-items:center;gap:6px}
  .terr-derived{display:none;align-items:center;gap:10px;background:var(--teal-soft);border:1px solid #bcdbe1;border-radius:12px;padding:12px 14px;margin-top:-4px;margin-bottom:14px}
  .terr-derived.show{display:flex}
  .terr-derived svg{width:20px;height:20px;color:var(--teal);flex:none}
  .terr-derived .t{font-size:13px;color:#155c6a}
  .terr-derived .t b{font-family:'Archivo';font-weight:700}
  .form-actions{display:flex;gap:10px;margin-top:22px}
  .btn-primary{flex:1;height:56px;border-radius:14px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:16px}
  .btn-primary:active{transform:scale(.985)}
  .btn-ghost{height:56px;padding:0 20px;border-radius:14px;color:var(--muted);font-weight:600;border:1px solid var(--border)}
  .kindtoggle{display:flex;border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:18px}
  .kindtoggle button{flex:1;padding:14px 8px;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
  .kindtoggle button svg{width:20px;height:20px}
  .kindtoggle button[aria-pressed="true"]{background:var(--teal);color:#fff}
  .kindtoggle button:nth-child(2)[aria-pressed="true"]{background:#3a4d57}
  .kindnote{font-size:13px;color:var(--muted);margin:-8px 0 16px;padding:0 2px}

  .mapcanvas{position:relative;height:340px;background:linear-gradient(0deg,rgba(31,122,140,.05),rgba(31,122,140,.05)),repeating-linear-gradient(0deg,transparent 0 39px,#dfe7e9 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#dfe7e9 39px 40px),#eef4f5;border-bottom:1px solid var(--border);overflow:hidden}
  @media(min-width:900px){.mapcanvas{height:460px}}

  .pin{position:absolute;transform:translate(-50%,-100%);z-index:2;cursor:pointer}

  .youare{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);z-index:3}
  .youare::before{content:"";position:absolute;inset:0;border-radius:50%;background:#2b7de0;box-shadow:0 0 0 4px rgba(43,125,224,.25),0 0 0 8px rgba(43,125,224,.12)}
  .maplegend{display:flex;gap:16px;padding:14px 18px 4px;flex-wrap:wrap}
  .leg{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted)}
  .leg i{width:11px;height:11px;border-radius:3px}
  .nearme{margin:14px 18px;padding:16px;border:1px dashed var(--border);border-radius:15px;display:flex;align-items:center;gap:14px;background:var(--surface)}
  .nearme .ic{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;flex:none;color:var(--teal)}
  .nearme .ic svg{width:24px;height:24px}
  .nearme .t{font-family:'Archivo';font-weight:700;font-size:15px}
  .nearme .d{font-size:13px;color:var(--muted);margin-top:2px}
  .nearme .soon{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--amber);background:var(--amber-soft);padding:5px 9px;border-radius:20px;flex:none}

  .detail-placeholder{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;color:var(--muted);text-align:center;padding:40px}
  .detail-placeholder svg{width:56px;height:56px;color:#c4ced1;margin-bottom:16px}
  .detail-placeholder b{font-family:'Archivo';font-size:17px;color:var(--ink)}
  .detail-placeholder p{font-size:14px;margin-top:6px;max-width:260px}

  .databar{font-size:12px;text-align:center;padding:8px 14px;font-weight:500;line-height:1.45}
  .databar.load{background:var(--ink);color:#cfe0e4}
  .databar.warn{background:var(--amber-soft);color:#7a4d05}
  .databar.err{background:var(--red-soft);color:#8e2a20}
  .databar b{font-weight:700}
  .databar button{margin-left:8px;border:1px solid currentColor;border-radius:7px;padding:2px 9px;font-size:11px;font-weight:700;color:inherit}
  .terr-tag.callonly{background:var(--amber-soft);color:#7a4d05}
  .mapnote{padding:6px 16px 0;font-size:11.5px;color:var(--muted);text-align:center}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:19px;height:19px;color:#7ee0c0}
  @media(prefers-reduced-motion:reduce){.toast{transition:opacity .01s}.card{transition:none}}

  /* ══ DESKTOP DENSITY PASS (>=900px only) ════════════════════════
     Same palette, fonts and radii — this is scale and spacing only.
     Declared last so it overrides the earlier desktop blocks. Mobile
     never sees any of it. */
  @media(min-width:900px){
    /* use the window: the shell was capped at 1120px and floated in
       the middle of wide screens */
    body{padding:18px 20px}   /* keeps the card gutter on wide screens */
    .app{max-width:1460px;min-height:calc(100dvh - 36px);border-radius:18px}
    .split{grid-template-columns:184px minmax(330px,25%) 1fr}
    .split[data-desk="map"]{grid-template-columns:184px 1fr}

    .topbar{padding:10px 16px;gap:10px}
    .brand b{font-size:17px}
    .brand span{font-size:11px}
    .desktop-add{padding:8px 13px;font-size:13px;border-radius:10px}
    .desktop-add svg{width:16px;height:16px}

    .sidenav{padding:12px 8px;gap:2px}
    .snav-lbl{padding:2px 10px 6px;font-size:10px}
    .snav{padding:8px 10px;font-size:13px;border-radius:9px;gap:9px}
    .snav svg{width:18px;height:18px}

    .summary{padding:14px 14px 6px}
    .summary h1{font-size:13px}
    .stat{padding:9px 11px;border-radius:11px}
    .stat .n{font-size:24px}
    .stat .l{font-size:11px;margin-top:3px}
    .sectionhdr{padding:12px 14px 4px}
    .sectionhdr .lbl{font-size:11.5px}
    .list{padding:2px 10px 8px}

    /* cards */
    .swipe{margin:6px 0}
    .card-body{padding:10px 11px 10px 12px}
    .card-name{font-size:15px}
    .card-person{font-size:12px;margin-top:2px}
    .card-sub{font-size:11.5px;margin-top:2px}
    .card-right{padding:10px 12px 10px 6px}
    .badge-n{font-size:18px}
    .badge-l{font-size:9px;margin-top:2px}
    .terr-tag{font-size:9px;padding:2px 5px}
    /* Name truncation fix: the chips were flex:none, so they took their
       width first and the name shrank to nothing ("SOUTHE…"). Now the
       name keeps a floor and may run to two lines, and the chips shrink
       or wrap beneath instead of eating it. */
    .card-topline{flex-wrap:wrap;row-gap:3px;align-items:center}
    .card-name{flex:1 1 auto;min-width:13ch;white-space:normal;overflow-wrap:anywhere;
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .terr-tag{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* detail pane */
    .detail-head{padding:12px 16px 14px}
    .detail-name{font-size:20px}
    .detail-person{font-size:14px;margin-top:5px}
    .detail-freq{font-size:12px;margin-top:5px;gap:7px}
    .status-pill{font-size:11px;padding:4px 9px}
    /* don't let two buttons stretch across a 900px pane */
    .cta-row{padding:12px 16px 2px;gap:8px;justify-content:flex-start}
    .cta{flex:0 1 210px;height:44px;border-radius:11px;font-size:14px;gap:7px}
    .cta svg{width:18px;height:18px}
    .cta-visit{box-shadow:0 5px 14px rgba(31,122,140,.22)}
    .section{padding:14px 16px 2px}
    .section-title{font-size:11.5px;margin-bottom:7px}
    .section-title a{font-size:12px}
    .field{border-radius:11px}
    .field-row{padding:9px 13px;min-height:42px;gap:10px}
    .field-row .k{font-size:12.5px;width:68px}
    .field-row .v{font-size:13.5px}
    .field-row .go svg{width:17px;height:17px}
    .field-row .derived{font-size:10px}
    .stepper{border-radius:9px}
    .stepper button{width:36px;height:36px;font-size:19px}
    .stepper .val{min-width:86px;font-size:13.5px}
    .stepper .val small{font-size:10.5px}
    .toggle{width:44px;height:26px}
    .toggle::after{width:20px;height:20px}
    .toggle[aria-pressed="true"]::after{transform:translateX(18px)}
    .timeline{padding:2px 16px 18px}
    .tl{gap:10px}
    .detail-placeholder{min-height:300px;padding:28px}
    .detail-placeholder svg{width:44px;height:44px;margin-bottom:12px}
    .detail-placeholder b{font-size:15px}
    .detail-placeholder p{font-size:13px}

    /* forms sit in the detail pane too */
    .form{padding:16px}
    .form h2{font-size:19px}
  }

  /* ══ DESKTOP DETAIL STRUCTURE + ICON RAIL (>=900px only) ═══════════
     The detail pane was one narrow column of wall-to-wall rows in a wide
     pane. Split it: bounded cards on the left, timeline in its own column
     on the right. Declared after the density block so it wins.
     Below 900px .detail-body / .dcol are plain divs, so mobile keeps the
     exact single-column stack and order it had before. */
  @media(min-width:900px){
    /* padding lives on the container so both columns align */
    .detail-body{padding:0 16px 20px}
    .detail-body .section{padding:14px 0 2px}
    .detail-body .timeline{padding:4px 0 8px}
    .dcol{min-width:0}

    /* slim icon rail — more width for the content */
    .split{grid-template-columns:72px minmax(330px,24%) 1fr}
    .split[data-desk="map"]{grid-template-columns:72px 1fr}
    .sidenav{padding:10px 5px;gap:3px}
    .snav-lbl{display:none}
    .snav{position:relative;flex-direction:column;align-items:center;gap:5px;
          padding:9px 3px;font-size:10px;line-height:1.15;text-align:center;
          border-radius:10px;letter-spacing:.01em}
    .snav svg{width:21px;height:21px}
    .snav .cnt{position:absolute;top:4px;right:6px;margin-left:0;font-size:9px;line-height:1}
  }

  /* The two-column detail body needs ~440px + gap + a usable timeline
     column. Below this the rail + list + 440px card leaves the timeline
     ~40px wide ("HISTO…"), so it stays single-column until there is room. */
  @media(min-width:1240px){
    .detail-body{display:grid;grid-template-columns:440px minmax(320px,1fr);
                 align-items:start;column-gap:22px}
  }

  /* ══ DESKTOP: FIXED SHELL, PER-COLUMN SCROLLING (>=900px only) ═════
     The shell was min-height:100dvh, so with a long roster it grew to
     ~3200px and the whole document scrolled — nav and detail pane rode
     up with it. The panes already had overflow-y:auto, which does
     nothing without a bounded height.
     Now the shell is exactly viewport height and each column owns its
     own scroll region. Mobile keeps page scrolling: this is all inside
     the media query. */
  @media(min-width:900px){
    body{overflow:hidden}
    .app{height:calc(100dvh - 36px);min-height:0}
    .split{min-height:0}
    .sidenav{overflow-y:auto;min-height:0}      /* its own region */
    .pane-list{min-height:0}
    .scroll{min-height:0}                        /* flex:1 + overflow-y:auto already */
    .pane-detail{min-height:0}                   /* overflow-y:auto already */
  }
</style>

<script>
/* ===================================================================
   ROUNDS — live data from Supabase.
   The auth gate (vendor/auth-overlay.js) owns the client and session;
   we reuse it via window.roosterAuth.client(). We never call
   createClient() here — a second GoTrueClient in the same page races
   on token refresh. Every read is owner-scoped by RLS.
   Data loads on `rooster:authed`, never on page load.
   =================================================================== */
let TODAY=new Date(); const DAY=86400000;
const isDesktop=()=>window.matchMedia('(min-width:900px)').matches;
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmt(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtLong(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ===== TERRITORY: two-table lookup, exactly like the sheet ===== */
const RALEIGH_ZIPS={
  '27601':'RALEIGH-S','27605':'RALEIGH-S','27603':'RALEIGH-S','27606':'RALEIGH-S','27610':'RALEIGH-S','27529':'RALEIGH-S',
  '27604':'RALEIGH-N','27608':'RALEIGH-N','27609':'RALEIGH-N','27612':'RALEIGH-N','27613':'RALEIGH-N','27614':'RALEIGH-N','27615':'RALEIGH-N','27616':'RALEIGH-N','27617':'RALEIGH-N','27618':'RALEIGH-N',
  '27607':'WEST'
};
const CITY_TERR={
  'CARY':'WEST','APEX':'WEST','MORRISVILLE':'WEST','NEW HILL':'WEST',
  'FUQUAY VARINA':'SOUTH','FUQUAY-VARINA':'SOUTH','HOLLY SPRINGS':'SOUTH','WILLOW SPRING':'SOUTH','LILLINGTON':'SOUTH',
  'WAKE FOREST':'NORTH','YOUNGSVILLE':'NORTH','ROLESVILLE':'NORTH','FRANKLINTON':'NORTH',
  'GARNER':'SOUTHEAST','CLAYTON':'SOUTHEAST','ANGIER':'SOUTHEAST','BENSON':'SOUTHEAST','COATS':'SOUTHEAST','SMITHFIELD':'SOUTHEAST',
  'LOUISBURG':'FAR NORTH','CREEDMOOR':'FAR NORTH','HENDERSON':'FAR NORTH','KITTRELL':'FAR NORTH','BUNN':'FAR NORTH',
  'WENDELL':'EAST','ZEBULON':'EAST','KNIGHTDALE':'EAST','MIDDLESEX':'EAST',
  'DURHAM':'DURHAM','CHAPEL HILL':'DURHAM','PITTSBORO':'DURHAM','MONCURE':'DURHAM','HILLSBOROUGH':'DURHAM',
  'SANFORD':'SANFORD'
};
const TERR_ORDER=['RALEIGH-N','RALEIGH-S','NORTH','SOUTH','SOUTHEAST','EAST','FAR NORTH','WEST','DURHAM','SANFORD','RALEIGH-UNASSIGNED','OUT OF RANGE'];
function addrBits(addr){
  // Parse by comma segments, not loose regex. Two traps this avoids:
  //   - a bare \d{5} match grabs PO Box / street numbers ("PO BOX 12061")
  //   - a lazy city match ate "MO" out of "MONCURE" because the NC in
  //     MO-NC-URE satisfied the state token.
  const out={city:'',state:'',zip:null};
  if(!addr) return out;
  const parts=String(addr).split(',').map(x=>x.trim()).filter(Boolean);
  let si=-1;
  for(let i=parts.length-1;i>=0;i--){
    const m=parts[i].match(/^([A-Za-z]{2})(?:\s+(\d{5}))?(?:-\d{4})?$/);
    if(m){si=i;out.state=m[1].toUpperCase();if(m[2])out.zip=m[2];break;}
  }
  if(si>0) out.city=parts[si-1].toUpperCase();
  if(si===-1){
    // No "ST" / "ST 12345" segment — try "CITY ST ZIP" in the last segment.
    const tail=parts[parts.length-1]||'';
    const m=tail.match(/^(.+?)\s+([A-Za-z]{2})\s+(\d{5})(?:-\d{4})?$/);
    if(m){out.city=m[1].trim().toUpperCase();out.state=m[2].toUpperCase();out.zip=m[3];}
    else if(parts.length>=2) out.city=parts[parts.length-2].toUpperCase();
  }
  // Zip always comes from the LAST 5-digit run, never the first.
  if(!out.zip){const zs=String(addr).match(/\b\d{5}\b/g); if(zs) out.zip=zs[zs.length-1];}
  return out;
}
function deriveTerritory(addr){
  if(!addr) return 'OUT OF RANGE';
  const b=addrBits(addr);
  // The lookup tables are NC-only. An out-of-state address that happens to
  // share an NC city name (CLAYTON, GA) is not in the rotation.
  if(b.state && b.state!=='NC') return 'OUT OF RANGE';
  // Raleigh is zip-driven; a Raleigh address whose zip isn't in the table is
  // RALEIGH-UNASSIGNED (a known-city gap), not OUT OF RANGE (unknown city).
  if(b.city==='RALEIGH') return (b.zip&&RALEIGH_ZIPS[b.zip])?RALEIGH_ZIPS[b.zip]:'RALEIGH-UNASSIGNED';
  if(CITY_TERR[b.city]) return CITY_TERR[b.city];
  if(b.zip&&RALEIGH_ZIPS[b.zip]) return RALEIGH_ZIPS[b.zip];
  return 'OUT OF RANGE';
}


/* ===== DATA LAYER ===== */
let contractors=[], currentOwnerId=null, dataLoaded=false, AC_DB=[];
const EMAIL_RE=/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;

function sbClient(){
  if(!window.roosterAuth||typeof window.roosterAuth.client!=='function')
    throw new Error('Auth gate not loaded — no Supabase client available.');
  return window.roosterAuth.client();
}
function addrString(r){
  const tail=[r.state,r.zip].filter(Boolean).join(' ');
  return [r.street_address,r.city,tail].filter(Boolean).join(', ');
}
function parseAddr(addr){
  const out={street_address:'',city:'',state:'NC',zip:''};
  if(!addr) return out;
  const zipM=addr.match(/\b(\d{5})\b/); if(zipM) out.zip=zipM[1];
  const stM=addr.match(/,\s*([A-Za-z]{2})\s*\d{5}/); if(stM) out.state=stM[1].toUpperCase();
  const parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
  if(parts[0]) out.street_address=parts[0];
  if(parts[1]) out.city=parts[1].toUpperCase();
  return out;
}
function rowToContractor(r,visits,updates){
  // visits + updates merged into one timeline, oldest first (the detail
  // view reverses it for newest-first display).
  const notes=[]
    .concat((visits||[]).map(v=>({kind:'visit',when:new Date(v.visited_on+'T09:00:00'),txt:v.note||''})))
    .concat((updates||[]).map(u=>({kind:'update',when:new Date(u.created_at),txt:u.note||''})))
    .sort((a,b)=>a.when-b.when);
  const contact=(r.contact||'').trim();
  const em=contact.match(EMAIL_RE);
  const lat=r.lat==null?null:Number(r.lat), lng=r.lng==null?null:Number(r.lng);
  return {
    id:r.id, legacy:r.legacy_id||'', name:r.company||'(unnamed)',
    contact, email:em?em[0]:'', phone:r.phone||'',
    addr:addrString(r), city:r.city||'', zip:r.zip||'',
    territory:r.territory||'OUT OF RANGE',
    freq:r.target_days||60,
    lastVisit:r.last_visited?new Date(r.last_visited+'T09:00:00'):null, // NULL = calm start
    churned:r.status==='churned',
    visitable:r.visitable||'VISIT',
    callOnly:(r.visitable||'VISIT')==='CALL ONLY',
    starred:!!r.starred,
    lat:Number.isFinite(lat)?lat:null, lng:Number.isFinite(lng)?lng:null,
    notes
  };
}
function buildAcDb(){
  const seen=new Set(); AC_DB=[];
  contractors.forEach(c=>{
    if(!c.addr) return;
    const parts=c.addr.split(',').map(s=>s.trim());
    const street=parts[0]||''; const rest=parts.slice(1).join(', ');
    const k=street+'|'+rest;
    if(street&&rest&&!seen.has(k)){seen.add(k);AC_DB.push([street,rest]);}
  });
}
function setDataState(state,msg){
  const bar=document.getElementById('dataBar'); if(!bar) return;
  const bypass=window.roosterAuth&&window.roosterAuth.isLocalBypass&&window.roosterAuth.isLocalBypass();
  if(state==='loading'){bar.hidden=false;bar.className='databar load';bar.innerHTML='Loading contractors…';}
  else if(state==='error'){bar.hidden=false;bar.className='databar err';
    bar.innerHTML=`<b>Couldn't load your contractors.</b> ${esc(msg||'')} <button onclick="loadData()">Retry</button>`;}
  else if(state==='empty'){bar.hidden=false;bar.className='databar warn';
    bar.innerHTML=bypass
      ? `No rows returned. On localhost the gate <b>bypasses auth</b>, so there is no session and RLS returns nothing. Open <b>?forceauth=1</b> and sign in to see real data.`
      : `No contractors for this account yet. Rows are owner-scoped by RLS.`;}
  else {bar.hidden=true;bar.innerHTML='';}
}
async function loadData(){
  setDataState('loading');
  try{
    const sb=sbClient();
    const {data:{user}}=await sb.auth.getUser();
    currentOwnerId=user?user.id:null;
    const [c,v,u]=await Promise.all([
      sb.from('contractors').select('*').order('company',{ascending:true}),
      sb.from('visits').select('*'),
      sb.from('updates').select('*')
    ]);
    if(c.error) throw c.error;
    if(v.error) throw v.error;
    if(u.error) throw u.error;
    const vBy={},uBy={};
    (v.data||[]).forEach(x=>{(vBy[x.contractor_id]=vBy[x.contractor_id]||[]).push(x);});
    (u.data||[]).forEach(x=>{(uBy[x.contractor_id]=uBy[x.contractor_id]||[]).push(x);});
    contractors=(c.data||[]).map(r=>rowToContractor(r,vBy[r.id],uBy[r.id]));
    TODAY=new Date(); dataLoaded=true; buildAcDb();
    setDataState(contractors.length?'ok':'empty');
    renderTodayHead(); renderNavCounts();
    if(currentId&&!contractors.some(x=>x.id===currentId)) currentId=null;
    fillTerrSelects(); renderToday();
    if(document.getElementById('view-map').classList.contains('active')) renderMap();
    if(isDesktop()&&!document.getElementById('view-map').classList.contains('active')){
      renderContractors(); document.getElementById('view-detail').classList.add('active');
    } else if(isDesktop()){ renderContractors(); }
    if(currentId) openDetail(currentId);
  }catch(err){
    console.error('[rounds] load failed:',err);
    dataLoaded=false;
    setDataState('error',err.message||String(err));
    const el=document.getElementById('todayList'); if(el) el.innerHTML='';
  }
}
async function mutate(fn,okMsg){
  try{ await fn(); toast(okMsg); await loadData(); }
  catch(err){ console.error('[rounds] write failed:',err); toast('Save failed — '+(err.message||'try again')); }
}
function persistVisit(id,dateStr,note){
  const sb=sbClient();
  return sb.from('visits').insert({owner_id:currentOwnerId,contractor_id:id,visited_on:dateStr,note:note||null})
    .then(r=>{if(r.error)throw r.error;
      return sb.from('contractors').update({last_visited:dateStr}).eq('id',id);})
    .then(r=>{if(r.error)throw r.error;});
}
function persistUpdate(id,note){ // never touches last_visited
  return sbClient().from('updates').insert({owner_id:currentOwnerId,contractor_id:id,note:note})
    .then(r=>{if(r.error)throw r.error;});
}
function persistChurn(id,churned){
  return sbClient().from('contractors').update({status:churned?'churned':'active'}).eq('id',id)
    .then(r=>{if(r.error)throw r.error;});
}
function persistFreq(id,days){
  return sbClient().from('contractors').update({target_days:days}).eq('id',id)
    .then(r=>{if(r.error)throw r.error;});
}

/* ===== STATUS MATH — NULL last_visited = calm start, never overdue ===== */
function daysSince(c){if(!c.lastVisit)return null;return Math.round((dayStart(TODAY)-dayStart(c.lastVisit))/DAY);}
function overdueBy(c){const d=daysSince(c);return d===null?null:d-c.freq;}
function sortKey(c){const o=overdueBy(c);return o===null?-1e9:o;}
function statusClass(c){const o=overdueBy(c);if(o===null)return'cool';return o>7?'hot':o>=0?'due':'cool';}
function statusLabel(c){const o=overdueBy(c);
  if(o===null)return{n:'—',l:'not yet'};
  if(o>7)return{n:o,l:'days over'};
  if(o>=0)return{n:o===0?'today':o,l:o===0?'due':'days over'};
  return{n:Math.abs(o),l:'days left'};}
function statusText(c){const o=overdueBy(c);
  if(o===null)return 'Not visited yet';
  if(o>7)return `${o} days overdue`;
  if(o>0)return `${o} day${o>1?'s':''} overdue`;
  if(o===0)return 'Due today';
  return `Due in ${Math.abs(o)} days`;}
function freqWord(f){return ({7:'Weekly',14:'Every 2 weeks',21:'Every 3 weeks',30:'Monthly',45:'Every 6 weeks',60:'Every 2 months',90:'Quarterly'})[f]||`Every ${f} days`;}
function lastTouch(c){const d=daysSince(c);if(d===null)return'never';return d===0?'today':d===1?'yesterday':`${d} days ago`;}
function personLine(c){return c.contact?esc(c.contact):'';}
function activeTerritories(){const set=new Set(contractors.filter(c=>!c.churned).map(c=>c.territory));return TERR_ORDER.filter(t=>set.has(t)).concat([...set].filter(t=>!TERR_ORDER.includes(t)).sort());}

function renderTodayHead(){
  const h=document.getElementById('todayHead');
  if(h) h.textContent='Today · '+TODAY.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function renderNavCounts(){
  const a=contractors.filter(c=>!c.churned);
  const t=document.getElementById('navCntToday'); const all=document.getElementById('navCntAll');
  if(t) t.textContent=dataLoaded?String(a.filter(c=>{const o=overdueBy(c);return o!==null&&o>=0;}).length||''):'';
  if(all) all.textContent=dataLoaded?String(contractors.length||''):'';
}

function cardHTML(c,{swipe=false}={}){
  const s=c.churned?'churn':statusClass(c);
  const sub=c.churned?`Churned · last touch ${c.lastVisit?fmt(c.lastVisit):'never'}`:`${freqWord(c.freq)} · last touch ${lastTouch(c)}`;
  const person=personLine(c);
  const right=c.churned?'':(()=>{const sl=statusLabel(c);return `<div class="card-right"><span class="badge-n">${esc(sl.n)}</span><span class="badge-l">${esc(sl.l)}</span></div>`;})();
  const callTag=c.callOnly?`<span class="terr-tag callonly">CALL ONLY</span>`:'';
  const inner=`<button class="card ${s}" data-cid="${esc(c.id)}" onclick="openDetail('${esc(c.id)}')">
      <span class="gauge ${s}"></span>
      <div class="card-body">
        <div class="card-topline"><span class="card-name">${esc(c.name)}</span><span class="terr-tag">${esc(c.territory)}</span>${callTag}</div>
        ${person?`<div class="card-person">${person}</div>`:''}
        <div class="card-sub">${sub}</div>
      </div>
      ${right}
    </button>`;
  if(!swipe) return `<div class="swipe">${inner}</div>`;

      <button class="sa-visit" onclick="quickLog('${esc(c.id)}','visit')"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Log visit</button>

    </div>${inner}</div>`;
}

function renderToday(){
  const el=document.getElementById('todayList'); if(!el)return;
  const terrSel=document.getElementById('todayTerr');
  const terr=(terrSel&&terrSel.value)||'ALL';
  if(!dataLoaded){el.innerHTML=`<p class="emptynote">Loading…</p>`;return;}
  let act=contractors.filter(c=>!c.churned);
  if(terr!=='ALL') act=act.filter(c=>c.territory===terr);
  sHot.textContent=act.filter(c=>{const o=overdueBy(c);return o!==null&&o>7;}).length;
  sDue.textContent=act.filter(c=>{const o=overdueBy(c);return o!==null&&o>=0&&o<=7;}).length;
  sCool.textContent=act.filter(c=>{const o=overdueBy(c);return o===null||o<0;}).length;
  const cnt=document.getElementById('todayCnt');
  cnt.textContent = terr==='ALL' ? `${act.length} active across all territories` : `${act.length} in ${terr}`;
  const rows=act.slice().sort((a,b)=>sortKey(b)-sortKey(a));
  el.innerHTML = rows.length ? rows.map(c=>cardHTML(c,{swipe:true})).join('')
    : `<p class="emptynote">${terr==='ALL'?'No active contractors yet.':'No active contractors in '+esc(terr)+'. Pick another territory up top.'}</p>`;
  attachSwipe(); markSelected();
}

function markSelected(){document.querySelectorAll('.card').forEach(el=>el.classList.toggle('selected', isDesktop()&&currentId&&el.dataset.cid==currentId));}

function attachSwipe(){
  document.querySelectorAll('#todayList .swipe').forEach(wrap=>{
    const card=wrap.querySelector('.card'); let startX=0,dx=0,open=false,dragging=false; const MAX=170;
    const reset=()=>{card.style.transform='';open=false;};
    card.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;dragging=true;card.style.transition='none';},{passive:true});
    card.addEventListener('touchmove',e=>{if(!dragging)return;dx=e.touches[0].clientX-startX+(open?-MAX:0);if(dx>0)dx=0;if(dx<-MAX)dx=-MAX;card.style.transform=`translateX(${dx}px)`;},{passive:true});
    card.addEventListener('touchend',()=>{dragging=false;card.style.transition='';if(dx<-MAX/2){card.style.transform=`translateX(${-MAX}px)`;open=true;}else reset();});
  });
}
function quickLog(id,kind){
  currentId=id;
  if(kind!=='visit'){ openLog('update'); return; }
  // Desktop hover action opens the visit form so a note can be entered,
  // matching the detail-pane "Log visit" button and "Add update".
  // Mobile keeps the instant log — that is the point of the swipe in the
  // field, where typing a note is not always practical.
  if(isDesktop()){ openLog('visit'); return; }
  const c=contractors.find(x=>x.id===id); if(!c)return;
  const d=dayStart(new Date()).toISOString().slice(0,10);
  mutate(()=>persistVisit(id,d,''),'Visit logged for '+c.name);
}

    <div class="dcol dcol-left">
    <div class="section">
      <div class="section-title">Contact</div>
      <div class="field">
        <a class="field-row link" href="tel:${esc(callNum)}"><span class="k">Call</span><span class="v">${esc(c.phone)||'—'}</span><span class="go"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span></a>
        ${emailRow}
        ${addrRow}
        <div class="field-row"><span class="k">Territory</span><span class="v">${esc(c.territory)}</span><span class="derived">Auto from address</span></div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Visit every</div>
      <div class="field"><div class="field-row"><span class="k" style="width:auto">How often</span><span class="spacer" style="flex:1"></span>
        <div class="stepper"><button onclick="bumpFreq(-1)" aria-label="Less often">−</button><div class="val"><span id="freqVal">${freqWord(c.freq)}</span><small><span id="freqDays">${c.freq}</span> days</small></div><button onclick="bumpFreq(1)" aria-label="More often">+</button></div>
      </div></div>
    </div>
    <div class="section">
      <div class="section-title">Rotation</div>
      <div class="field"><div class="field-row"><span class="k" style="width:auto">${c.churned?'Churned — hidden from Today':'Active in rotation'}</span><span class="spacer" style="flex:1"></span><button class="toggle" aria-pressed="${!c.churned}" onclick="toggleChurn()" aria-label="Toggle rotation"></button></div></div>
    </div>
    </div><!-- /dcol-left -->
    <div class="dcol dcol-right">
    <div class="section"><div class="section-title">History<span class="spacer"></span><a href="#" onclick="editContractor(event)">Edit details</a></div></div>
    <div class="timeline" id="timeline">${timeline}</div>
    </div><!-- /dcol-right -->
    </div><!-- /detail-body -->
  `;
  const ph=document.getElementById('detailPlaceholder'); if(ph)ph.style.display='none';
  document.getElementById('detailBody').style.display='block';
  if(isDesktop()){ setDetailView('detail'); } else { showDetailMobile(); }
  markSelected();
}
function showDetailMobile(){document.querySelectorAll('#view-today,#view-contractors,#view-map,#view-add-mobile,#view-log-mobile').forEach(v=>v.classList.remove('active'));document.getElementById('view-detail').classList.add('active');document.getElementById('topSub').textContent='Contractor';updateFab();}
function backFromDetail(){document.getElementById('view-detail').classList.remove('active');show(cameFrom);}
function expandTimeline(e){e.preventDefault();const c=contractors.find(x=>x.id===currentId);if(!c)return;const shown=c.notes.slice().reverse();document.getElementById('timeline').innerHTML=shown.map((n,i)=>`<div class="tl"><div class="tl-rail"><div class="tl-dot ${n.kind}"><svg viewBox="0 0 24 24" fill="none">${n.kind==='visit'?'<path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>':'<path d="M4 20h4L18 10l-4-4L4 16v4z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>'}</svg></div>${i===shown.length-1?'':'<div class="tl-line"></div>'}</div><div class="tl-body"><div><span class="tl-kind ${n.kind}">${n.kind==='visit'?'Visit':'Update'}</span><span class="tl-when">${fmtLong(n.when)}</span></div>${n.txt?`<div class="tl-txt">${esc(n.txt)}</div>`:''}</div></div>`).join('');}

const FREQS=[7,14,21,30,45,60,90];
let freqTimer=null;
function bumpFreq(dir){
  const c=contractors.find(x=>x.id===currentId); if(!c)return;
  let i=FREQS.indexOf(c.freq); if(i<0)i=FREQS.findIndex(f=>f>=c.freq); if(i<0)i=FREQS.length-1;
  i=Math.min(FREQS.length-1,Math.max(0,i+dir));
  c.freq=FREQS[i];
  document.getElementById('freqVal').textContent=freqWord(c.freq);
  document.getElementById('freqDays').textContent=c.freq;
  renderToday();
  // debounced so holding +/- doesn't fire a write per click
  clearTimeout(freqTimer); const days=c.freq, id=c.id;
  freqTimer=setTimeout(()=>mutate(()=>persistFreq(id,days),'Cadence saved'),700);
}
function toggleChurn(){
  const c=contractors.find(x=>x.id===currentId); if(!c)return;
  const next=!c.churned;
  mutate(()=>persistChurn(c.id,next),next?'Moved out of rotation':'Back in rotation');
}

let logKind='visit';
function logFormHTML(){
  return `<div class="form">
    <button class="back mobile-only" id="logBack" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <h2 id="logTitle">Log a visit</h2><p class="hint" id="logFor"></p>
    <div class="kindtoggle">
      <button id="kVisit" aria-pressed="true" onclick="setKind('visit')"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Log visit</button>
      <button id="kUpdate" aria-pressed="false" onclick="setKind('update')"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10l-4-4L4 16v4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Add update</button>
    </div>
    <p class="kindnote" id="kindNote">A visit resets the clock and moves them down your list.</p>
    <div class="inp" id="dateWrap"><label for="vDate">When</label><input id="vDate" type="date"></div>
    <div class="inp"><label id="noteLabel">Notes <span class="opt">— optional</span></label><textarea id="vNote" placeholder="What came up? Anything to follow on?"></textarea></div>
    <div class="form-actions"><button class="btn-ghost" id="logCancel">Cancel</button><button class="btn-primary" id="logSave" onclick="saveLog()">Save visit</button></div>
  </div>`;
}
function setKind(k){logKind=k;kVisit.setAttribute('aria-pressed',k==='visit');kUpdate.setAttribute('aria-pressed',k==='update');document.getElementById('logTitle').textContent=k==='visit'?'Log a visit':'Add an update';document.getElementById('kindNote').textContent=k==='visit'?'A visit resets the clock and moves them down your list.':"An update is just a note — it doesn't change when they're next due.";document.getElementById('dateWrap').style.display=k==='visit'?'block':'none';document.getElementById('noteLabel').innerHTML=k==='visit'?'Notes <span class="opt">— optional</span>':'Note';document.getElementById('logSave').textContent=k==='visit'?'Save visit':'Save update';}
function openLog(kind){
  const c=contractors.find(x=>x.id===currentId); if(!c)return;
  const host=isDesktop()?document.getElementById('view-log'):document.getElementById('view-log-mobile');
  host.innerHTML=logFormHTML();
  document.getElementById('logFor').textContent='for '+c.name;
  document.getElementById('vDate').value=dayStart(new Date()).toISOString().slice(0,10);
  document.getElementById('vNote').value='';
  setKind(kind||'visit');
  const lb=document.getElementById('logBack'); if(lb)lb.onclick=()=>openDetail(currentId);
  document.getElementById('logCancel').onclick=()=>openDetail(currentId);
  if(isDesktop())setDetailView('log'); else {document.querySelectorAll('#view-today,#view-contractors,#view-map,#view-detail,#view-add-mobile').forEach(v=>v.classList.remove('active'));document.getElementById('view-log-mobile').classList.add('active');document.getElementById('scroll').scrollTop=0;}
}
function saveLog(){
  const c=contractors.find(x=>x.id===currentId); if(!c)return;
  const note=document.getElementById('vNote').value.trim();
  if(logKind==='visit'){
    const dateStr=document.getElementById('vDate').value||dayStart(new Date()).toISOString().slice(0,10);
    mutate(()=>persistVisit(c.id,dateStr,note),'Visit logged for '+c.name);
  } else {
    if(!note){document.getElementById('vNote').focus();toast('Add a note first');return;}
    mutate(()=>persistUpdate(c.id,note),'Update added');
  }
}

let editingId=null;
function addFormHTML(){
  return `<div class="form">
    <button class="back mobile-only" onclick="closeAdd()" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <h2 id="addTitle">Add a contractor</h2><p class="hint">Business name is enough to start. Fill in the rest whenever.</p>
    <div class="inp"><label for="cName">Business name</label><input id="cName" placeholder="e.g. Cardinal Comfort Systems"></div>

    <div class="grouplbl">Primary contact</div>
    <div class="inp"><label for="cContact">Contact <span class="opt">— optional, free text</span></label><input id="cContact" placeholder="e.g. Dave Whitfield, owner"></div>

    <div class="grouplbl">Location</div>
    <div class="inp"><label for="cPhone">Phone</label><input id="cPhone" type="tel" inputmode="tel" placeholder="(919) 555-0148"></div>
    <div class="inp ac"><label for="cAddr">Address <span class="opt">— street, city, ST zip</span></label>
      <input id="cAddr" autocomplete="off" placeholder="123 Main St, Clayton, NC 27520" oninput="acInput(this.value)" onblur="setTimeout(acHide,150)">
      <div class="ac-list" id="acList"></div>
    </div>
    <div class="terr-derived" id="terrDerived">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="2"/></svg>
      <div class="t">Territory: <b id="terrDerivedVal">—</b> <span style="color:#5f7079">· set automatically from the address</span></div>
    </div>

    <div class="form-actions"><button class="btn-ghost" onclick="closeAdd()">Cancel</button><button class="btn-primary" onclick="saveContractor()">Save contractor</button></div>
    <p class="hint" style="margin-top:14px">You'll set how often to visit on their page.</p>
  </div>`;
}
function acInput(v){
  const list=document.getElementById('acList'); const q=v.trim().toLowerCase();
  updateDerivedTerr(v);
  if(q.length<2){acHide();return;}
  const hits=AC_DB.filter(a=>(a[0]+' '+a[1]).toLowerCase().includes(q)).slice(0,5);
  if(!hits.length){acHide();return;}
  list.innerHTML=hits.map(a=>{const full=esc(a[0]+', '+a[1]).replace(/'/g,'&#39;');
    return `<div class="ac-item" onmousedown="acPick('${full}')" ontouchstart="acPick('${full}')"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="9" r="2.3" stroke="currentColor" stroke-width="1.7"/></svg><div><div class="main">${esc(a[0])}</div><div class="sub">${esc(a[1])}</div></div></div>`;}).join('')
    +`<div class="ac-foot"><svg viewBox="0 0 24 24" fill="none" style="width:13px;height:13px"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>Existing addresses on file · Places lookup comes later</div>`;
  list.classList.add('show');
}
function updateDerivedTerr(addr){
  const box=document.getElementById('terrDerived'); if(!box)return;
  const t=deriveTerritory(addr);
  // Show the preview once we can actually read a state or zip out of the
  // text — same parser the save path uses, so preview and result agree.
  const b=addrBits(addr);
  if(addr && (b.state||b.zip)){document.getElementById('terrDerivedVal').textContent=t;box.classList.add('show');}
  else box.classList.remove('show');
}
function acPick(full){document.getElementById('cAddr').value=full;acHide();updateDerivedTerr(full);toast('Address set · territory '+deriveTerritory(full));}
function acHide(){const l=document.getElementById('acList');if(l)l.classList.remove('show');}
function openAdd(){editingId=null;mountAdd();const t=document.getElementById('addTitle');if(t)t.textContent='Add a contractor';}
function mountAdd(){
  const host=isDesktop()?document.getElementById('view-add'):document.getElementById('view-add-mobile');
  host.innerHTML=addFormHTML();
  if(isDesktop())setDetailView('add');
  else {document.querySelectorAll('#view-today,#view-contractors,#view-map,#view-detail,#view-log-mobile').forEach(v=>v.classList.remove('active'));document.getElementById('view-add-mobile').classList.add('active');document.getElementById('scroll').scrollTop=0;document.getElementById('topSub').textContent='Contractor details';}
}
function closeAdd(){ if(editingId){openDetail(editingId);} else if(isDesktop()){setDetailView('detail');} else {show('contractors');} }
function editContractor(e){
  if(e)e.preventDefault();
  editingId=currentId; const c=contractors.find(x=>x.id===currentId); if(!c)return;
  mountAdd();
  document.getElementById('addTitle').textContent='Edit contractor';
  cName.value=c.name;cContact.value=c.contact||'';cPhone.value=c.phone||'';cAddr.value=c.addr||'';
  updateDerivedTerr(c.addr||'');
}
async function saveContractor(){
  const name=cName.value.trim();
  if(!name){cName.focus();cName.style.borderColor='var(--red)';toast('Add a business name');return;}
  const addr=cAddr.value.trim();
  const p=parseAddr(addr);
  const payload={
    company:name,
    contact:cContact.value.trim()||null,
    phone:cPhone.value.trim()||null,
    street_address:p.street_address||null,
    city:p.city||null, state:p.state||'NC', zip:p.zip||null,
    territory:deriveTerritory(addr)
  };
  const id=editingId;
  try{
    const sb=sbClient();
    if(id){
      const r=await sb.from('contractors').update(payload).eq('id',id);
      if(r.error)throw r.error;
      editingId=null; toast('Saved changes'); await loadData(); openDetail(id);
    }else{
      if(!currentOwnerId) throw new Error('no signed-in user — cannot set owner');
      const r=await sb.from('contractors').insert(Object.assign({},payload,{
        owner_id:currentOwnerId, visitable:'VISIT', starred:false,
        target_days:60, last_visited:null, status:'active'
      })).select('id').single();
      if(r.error)throw r.error;
      toast(name+' added · '+payload.territory);
      await loadData(); openDetail(r.data.id);
    }
  }catch(err){console.error('[rounds] save contractor failed:',err);toast('Save failed — '+(err.message||'try again'));}
}

function renderMap(){
  const canvas=document.getElementById('mapcanvas'); if(!canvas)return;
  canvas.querySelectorAll('.pin').forEach(p=>p.remove());
  const note=document.getElementById('mapNote');
  const active=contractors.filter(c=>!c.churned);
  // Rows with no coordinates simply get no pin (C374 and ~50 others).
  const pts=active.filter(c=>c.lat!==null&&c.lng!==null);
  const skipped=active.length-pts.length;
  if(note) note.textContent=!dataLoaded?'Loading…'
    :pts.length?`${pts.length} mapped${skipped?` · ${skipped} without coordinates (no pin)`:''}`
    :'No coordinates on file yet — nothing to plot.';
  if(!pts.length)return;
  const w=canvas.clientWidth||360, ht=canvas.clientHeight||340, pad=28;
  let minLat=Math.min(...pts.map(p=>p.lat)), maxLat=Math.max(...pts.map(p=>p.lat));
  let minLng=Math.min(...pts.map(p=>p.lng)), maxLng=Math.max(...pts.map(p=>p.lng));
  if(maxLat-minLat<1e-6){minLat-=0.02;maxLat+=0.02;}
  if(maxLng-minLng<1e-6){minLng-=0.02;maxLng+=0.02;}
  pts.forEach(c=>{
    const x=pad+((c.lng-minLng)/(maxLng-minLng))*(w-pad*2);
    const y=pad+((maxLat-c.lat)/(maxLat-minLat))*(ht-pad*2);
    const s=statusClass(c);
    const pin=document.createElement('div');
    pin.className='pin '+s;pin.style.left=x+'px';pin.style.top=y+'px';
    pin.title=c.name+' · '+c.territory+' · '+statusText(c);
    pin.innerHTML='<svg viewBox="0 0 24 30"><path class="p" d="M12 0C5.4 0 0 5.2 0 11.6 0 20 12 30 12 30s12-10 12-18.4C24 5.2 18.6 0 12 0z"/><circle cx="12" cy="11.5" r="4.5" fill="#fff"/></svg>';
    pin.onclick=()=>openDetail(c.id);canvas.appendChild(pin);
  });
}

function show(view){
  document.querySelectorAll('#view-today,#view-contractors,#view-map,#view-add-mobile,#view-log-mobile,#view-detail').forEach(v=>v.classList.remove('active'));
  const target=document.getElementById('view-'+view); if(target)target.classList.add('active');
  document.getElementById('scroll').scrollTop=0;
  if(['today','contractors','map'].includes(view))cameFrom=view;
  const tabFor={today:'today',contractors:'contractors',map:'map'};
  // mobile bottom tabs
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected','false'));
  if(tabFor[view])document.getElementById('tab-'+tabFor[view]).setAttribute('aria-selected','true');
  // desktop side nav + pane geometry (data-desk drives the grid: map is full width)
  document.querySelectorAll('.snav').forEach(b=>b.setAttribute('aria-current','false'));
  if(tabFor[view]){
    const sn=document.getElementById('snav-'+tabFor[view]); if(sn)sn.setAttribute('aria-current','true');
    const split=document.querySelector('.split'); if(split)split.setAttribute('data-desk',view);
  }
  document.getElementById('topSub').textContent=({today:'Your rotation',contractors:'All contractors',map:'Territory map'})[view]||'';
  if(view==='today')renderToday();
  if(view==='contractors')renderContractors();
  // Today/Contractors keep master-detail; Map owns the whole pane.
  if(isDesktop()&&view!=='map'){document.getElementById('view-detail').classList.add('active');}
  if(view==='map')renderMap(); // after data-desk so clientWidth is the final width
  updateFab();
}
function setDetailView(which){['detail','add','log'].forEach(v=>document.getElementById('view-'+v).classList.remove('active'));document.getElementById('view-'+which).classList.add('active');const pd=document.querySelector('.pane-detail'); if(pd)pd.scrollTop=0;}
function updateFab(){document.getElementById('fabAdd').style.display=(!isDesktop()&&document.getElementById('view-contractors').classList.contains('active'))?'flex':'none';}

let toastT;function toast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

window.addEventListener('resize',()=>{
  markSelected();updateFab();
  if(document.getElementById('view-map').classList.contains('active'))renderMap();
});

/* ── BOOT ──────────────────────────────────────────────────────────
   Data loads on `rooster:authed`, which the gate fires once a session
   is confirmed — never on page load, so queries always carry a JWT.
   The shell renders immediately with a loading state.               */
function boot(){
  renderTodayHead();
  fillTerrSelects();
  show('today');           // sets tabs, side nav, and pane geometry together
  if(isDesktop()) renderContractors();
}
boot();
setDataState('loading');
document.addEventListener('rooster:authed',function(){ placeAuthBadge(); loadData(); });
setTimeout(placeAuthBadge,600); // safety net if the badge lands late
</script>
</body>
</html>
