<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Rounds</title>

<!-- ============================================================= -->
<!-- GATE SEAM — hvac-visits magic-link overlay. CC: paste the same  -->

<!-- Gate hides body children via .rooster-auth-pending until auth;   -->
<!-- .phone is a direct child of <body>, so it's covered. Do NOT add  -->
<!-- display:none to it. Reuse the gate's Supabase client via         -->
<!-- window.roosterAuth.client(); load data on the rooster:authed     -->
<!-- event, not on page load. See integration note.                  -->
<!-- ============================================================= -->
<link rel="stylesheet" href="vendor/auth-overlay.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="auth-config.js"></script>
<script src="vendor/auth-overlay.js"></script>
<style>
  :root{
    --tint:#0f6f80; --tint-fill:rgba(15,111,128,.10);
    --bg:#f2f2f7; --card:#fff; --sep:#c6c6c8; --sep-soft:#e5e5ea;
    --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
    --hot:#ff3b30; --hot-soft:rgba(255,59,48,.12);
    --due:#ff9500; --due-soft:rgba(255,149,0,.14);
    --cool:#0f6f80; --cool-soft:rgba(15,111,128,.12);
    --fill-gray:rgba(118,118,128,.12);
    --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.7); --glass-line:rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
    background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.29;letter-spacing:-.01em}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
  :focus-visible{outline:2px solid var(--tint);outline-offset:1px}
  .tnum{font-variant-numeric:tabular-nums}

  .phone{max-width:520px;margin:0 auto;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}

  /* ---- nav bar / large title ---- */
  .navbar{background:var(--bg);padding-top:max(14px,env(safe-area-inset-top));position:relative;z-index:5;flex:none}
  .detail .navbar{background:var(--glass);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);box-shadow:inset 0 -.5px 0 var(--glass-line)}
  .nb-inline{height:44px;display:flex;align-items:center;padding:0 8px;position:relative}
  .nb-back{display:flex;align-items:center;gap:3px;color:var(--tint);font-size:17px;padding:6px 6px 6px 2px}
  .nb-back svg{width:12px;height:20px}
  .nb-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;white-space:nowrap}
  .nb-action{margin-left:auto;color:var(--tint);font-size:17px;padding:6px 10px;display:flex;align-items:center}
  .nb-action.big svg{width:22px;height:22px}
  .large{font-size:34px;font-weight:700;letter-spacing:.37px;padding:0 16px 6px}
  .large .sub{display:block;font-size:15px;font-weight:400;letter-spacing:-.01em;color:var(--label2);margin-top:3px}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .screen{display:none}.screen.on{display:block}

  /* ---- grouped inset table ---- */
  .ghead{font-size:13px;font-weight:400;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:16px 16px 6px;display:flex;align-items:center}
  .ghead .filter{margin-left:auto;text-transform:none;letter-spacing:-.01em;color:var(--tint);font-weight:400;display:flex;align-items:center;gap:2px}
  .ghead .filter svg{width:12px;height:12px}
  /* tinted pill action in a section header */
  .ghead .pill{margin-left:auto;text-transform:none;letter-spacing:-.01em;display:flex;align-items:center;gap:5px;
    color:var(--tint);background:var(--tint-fill);font-size:14px;font-weight:600;padding:7px 13px;border-radius:18px;line-height:1}
  .ghead .pill svg{width:13px;height:13px}
  .ghead .pill:active{background:rgba(15,111,128,.2)}
  .group{background:var(--card);margin:0 16px;border-radius:14px;overflow:hidden}
  .cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;width:100%;text-align:left;background:var(--card);position:relative}
  .cell + .cell::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
  .cell.inset + .cell::before{left:52px}
  .cell:active{background:#e5e5ea}
  .cell .chev{margin-left:auto;flex:none;color:var(--label3)}
  .cell .chev svg{width:8px;height:14px;display:block}

  /* ---- Today: attention (reminders-style) ---- */
  .att-check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--due);flex:none;display:grid;place-items:center}
  .att-check svg{width:14px;height:14px;color:#fff;opacity:0}
  .att-check.done{background:var(--due);border-color:var(--due)}.att-check.done svg{opacity:1}
  .att-main{flex:1;min-width:0}
  .att-what{font-size:16px;line-height:1.25}
  .att-who{font-size:13px;color:var(--label2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-when{font-size:13px;font-weight:500;color:var(--due);flex:none;align-self:flex-start;margin-top:2px}
  .att-when.late{color:var(--hot)}

  /* stacked text must be block or spans collapse onto one line */
  .cell-name,.cell-meta,.att-what,.att-who,.rd-what,.tl-h,.tl-t,.read .d,.read .l{display:block}

  /* ---- heat dot + readout (the signature) ---- */
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dot.hot{background:var(--hot)}.dot.due{background:var(--due)}.dot.cool{background:var(--cool)}
  .cell-main{flex:1;min-width:0}
  .cell-name{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell-meta{font-size:13px;color:var(--label2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .read{flex:none;text-align:right;margin-left:6px}
  .read .d{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .read .l{font-size:11px;color:var(--label3);text-transform:uppercase;letter-spacing:.02em;margin-top:1px}
  .hot .read .d{color:var(--hot)}.due .read .d{color:var(--due)}.cool .read .d{color:var(--cool)}
  .tag{font-size:11px;font-weight:600;color:var(--label2);background:var(--fill-gray);border-radius:5px;padding:2px 6px;flex:none}
  .tag.call{color:var(--due);background:var(--due-soft)}

  /* ---- recently done (aligned glance list) ---- */
  .rd-row{display:flex;align-items:center;gap:13px;padding:12px 16px;width:100%;text-align:left;position:relative;background:var(--card)}
  .rd-row + .rd-row::before{content:"";position:absolute;left:53px;right:16px;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
  .rd-ic{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--cool-soft)}
  .rd-ic svg{width:15px;height:15px;color:var(--cool)}
  .rd-ic.note{background:var(--fill-gray)}.rd-ic.note svg{color:var(--label2)}
  .rd-main{flex:1;min-width:0}
  .rd-what{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .rd-what b{font-weight:600}
  .rd-when{font-size:13px;color:var(--label3);flex:none}

  /* ---- search + segmented (Contacts) ---- */
  .pad{padding:0 16px}
  .searchfield{display:flex;align-items:center;gap:6px;background:var(--fill-gray);border-radius:10px;padding:8px 8px;margin:2px 16px 10px}
  .searchfield svg{width:17px;height:17px;color:var(--label2);flex:none}
  .searchfield input{border:none;background:none;outline:none;font:inherit;font-size:17px;flex:1}
  .segmented{display:flex;background:var(--fill-gray);border-radius:9px;padding:2px;margin:0 16px 8px}
  .segmented button{flex:1;padding:6px 0;border-radius:7px;font-size:13px;font-weight:500;color:var(--label)}
  .segmented button[aria-pressed="true"]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}

  /* A–Z index */
  .idx{position:absolute;right:1px;top:120px;bottom:70px;display:flex;flex-direction:column;justify-content:center;gap:0;z-index:6}
  .idx button{font-size:10px;font-weight:600;color:var(--tint);line-height:1.18;padding:0 3px}
  .sticky{position:sticky;top:0;background:rgba(242,242,247,.94);backdrop-filter:blur(8px);font-size:14px;font-weight:600;color:var(--label);padding:3px 16px;z-index:3}

  /* ---- Today summary tiles (Reminders-style) ---- */
  .tiles{display:flex;gap:10px;padding:4px 16px 2px}
  .tile{flex:1;background:var(--card);border-radius:15px;padding:12px 12px 11px;text-align:left;position:relative}
  .tile:active{background:#e9e9ee}
  .tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
  .tile .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;display:block}
  .tile .l{font-size:12px;color:var(--label2);margin-top:6px;font-weight:500;display:block}
  .tile.hot{color:var(--hot)}.tile.hot .n{color:var(--hot)}
  .tile.due{color:var(--due)}.tile.due .n{color:var(--due)}
  .tile.cool{color:var(--cool)}.tile.cool .n{color:var(--cool)}
  .filter-note{font-size:13px;color:var(--tint);padding:2px 16px 0;display:none}
  .filter-note.on{display:block}

  /* ---- form fields (edit / add) ---- */
  .field{display:flex;align-items:center;gap:10px;padding:11px 16px;min-height:44px;position:relative;background:var(--card)}
  .field + .field::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
  .field label{font-size:16px;color:var(--label);width:96px;flex:none}
  .field input{border:none;background:none;outline:none;font:inherit;font-size:16px;flex:1;color:var(--label);min-width:0}
  .field input::placeholder{color:var(--label3)}
  .field .auto-area{font-size:16px;color:var(--label2);flex:1}
  .field .aux{font-size:12px;color:var(--label3);text-transform:uppercase;letter-spacing:.02em;flex:none}
  .destructive{width:100%;text-align:center;color:var(--hot);font-size:16px;padding:12px 16px;background:var(--card)}

  /* ---- detail (push) ---- */
  .detail{position:absolute;inset:0;background:var(--bg);z-index:10;transform:translateX(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
  .detail.on{transform:none}
  @media(prefers-reduced-motion:reduce){.detail{transition:none}}
  .d-scroll{flex:1;overflow-y:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .d-hero{text-align:center;padding:8px 24px 4px}
  .mono-av{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:30px;font-weight:600;color:#fff;position:relative}
  .mono-av .ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid transparent}
  .d-name{font-size:24px;font-weight:700;letter-spacing:.1px;line-height:1.15}
  .d-meta{font-size:15px;color:var(--label2);margin-top:4px}
  .qa{display:flex;gap:10px;padding:16px 16px 6px}
  .qa button{flex:1;background:var(--card);border-radius:11px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--tint)}
  .qa button:active{background:#e9e9ee}
  .qa svg{width:22px;height:22px}
  .qa span{font-size:11px;font-weight:500}
  .qa button.primary{background:var(--tint);color:#fff}
  .qa button.primary:active{filter:brightness(.94)}
  .status-line{margin:14px 16px 0;padding:10px 14px;border-radius:11px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .status-line.hot{background:var(--hot-soft);color:var(--hot)}
  .status-line.due{background:var(--due-soft);color:#b45f00}
  .status-line.cool{background:var(--cool-soft);color:var(--cool)}
  .kv .k{font-size:16px;color:var(--label);width:74px;flex:none}
  .kv .v{font-size:16px;flex:1}
  .kv .v.tint{color:var(--tint)}
  .kv .aux{font-size:12px;color:var(--label3);flex:none;text-transform:uppercase;letter-spacing:.02em}
  .stepper{display:flex;align-items:center;background:var(--fill-gray);border-radius:9px;overflow:hidden;flex:none}
  .stepper button{width:40px;height:34px;font-size:20px;color:var(--tint);display:grid;place-items:center}
  .stepper .v{min-width:90px;text-align:center;font-size:13px;font-weight:600;line-height:1.05}
  .stepper .v small{display:block;font-size:10px;font-weight:400;color:var(--label2)}
  .switch{position:relative;width:51px;height:31px;border-radius:16px;background:#e9e9ea;flex:none;transition:.2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
  .switch[aria-pressed="true"]{background:#34c759}.switch[aria-pressed="true"]::after{transform:translateX(20px)}
  .tl-cell{display:flex;gap:14px;padding:0 16px;position:relative}
  .tl-rail{display:flex;flex-direction:column;align-items:center;width:28px;flex:none}
  .tl-ic{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;z-index:1}
  .tl-ic svg{width:14px;height:14px;color:#fff}
  .tl-ic.visit{background:var(--cool)}
  .tl-ic.note{background:#8e8e93}
  .tl-ic.done{background:rgba(15,111,128,.18)}.tl-ic.done svg{color:var(--cool);width:15px;height:15px}
  .tl-line{width:2px;flex:1;background:var(--sep-soft);margin:3px 0}
  .tl-b{flex:1;padding-bottom:18px;min-width:0}
  .tl-h{font-size:14px;font-weight:700;display:block}
  .tl-h .t{font-weight:400;color:var(--label3);margin-left:7px}
  .tl-t{font-size:15px;margin-top:3px;color:var(--label);display:block;line-height:1.35}
  .tl-cell.muted .tl-h{font-size:13px;color:var(--label2)}
  .tl-cell.muted .tl-t{font-size:14px;color:var(--label2)}
  .tl-cell.muted .tl-ic svg{opacity:.85}

  /* ---- area chip bar (App Store / Music style) ---- */
  .chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chipbar::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:14px;font-weight:600;padding:8px 15px;border-radius:18px;white-space:nowrap;
    background:var(--card);color:var(--label2);box-shadow:inset 0 0 0 .5px var(--glass-line)}
  .chip:active{background:#e9e9ee}
  .chip[aria-pressed="true"]{background:var(--tint);color:#fff;box-shadow:none}

  /* ---- iOS 27 floating Liquid Glass dock ---- */
  .dock{position:absolute;left:0;right:0;bottom:0;z-index:40;max-width:430px;margin:0 auto;
    display:flex;align-items:center;gap:9px;padding:0 12px calc(9px + env(safe-area-inset-bottom));pointer-events:none}
  .tabbar{flex:1;pointer-events:auto;display:flex;border-radius:30px;padding:5px;
    background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
    box-shadow:inset 0 1px .5px var(--glass-edge), inset 0 0 0 .5px var(--glass-line), 0 8px 28px rgba(0,0,0,.16);position:relative}
  .tabbar button{flex:1;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#8a8a8e;border-radius:24px;transition:background .18s}
  .tabbar svg{width:25px;height:25px}
  .tabbar span{font-size:10px;font-weight:500;letter-spacing:0}
  .tabbar button[aria-selected="true"]{color:var(--tint);background:rgba(60,60,67,.10)}
  .fab-glass{pointer-events:auto;width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--tint);
    background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
    box-shadow:inset 0 1px .5px var(--glass-edge), inset 0 0 0 .5px var(--glass-line), 0 8px 28px rgba(0,0,0,.16);transition:transform .16s,opacity .16s}
  .fab-glass:active{transform:scale(.93)}
  .fab-glass svg{width:27px;height:27px}
  .fab-glass.hide{opacity:0;transform:scale(.8);pointer-events:none}

  /* action sheet (area filter) */
  .as-wrap{position:absolute;inset:0;z-index:30;display:none}
  .as-wrap.on{display:block}
  .as-scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:.25s}
  .as-wrap.on .as-scrim{opacity:1}
  .as{position:absolute;left:8px;right:8px;bottom:8px;transform:translateY(20px);transition:.28s;opacity:0}
  .as-wrap.on .as{transform:none;opacity:1}
  .as-list{background:rgba(248,248,248,.86);backdrop-filter:blur(28px);border-radius:14px;overflow:hidden;margin-bottom:8px}
  .as-list button{display:block;width:100%;text-align:center;padding:16px;font-size:20px;color:var(--tint);position:relative}
  .as-list button + button::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
  .as-list .title{padding:14px;font-size:13px;color:var(--label2)}
  .as-cancel{width:100%;background:#fff;border-radius:14px;padding:16px;font-size:20px;font-weight:600;color:var(--tint)}

  .note{background:var(--card);border-radius:11px;padding:14px 16px;font-size:14px;color:var(--label2);margin:0 16px;line-height:1.45}
  .note b{color:var(--label);font-weight:600}

  /* next steps rows */
  .ns-row{display:flex;gap:12px;padding:12px 16px;align-items:flex-start;width:100%;text-align:left;position:relative;background:var(--card)}
  .ns-row + .ns-row::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
  .ns-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--cool);flex:none;margin-top:1px;display:grid;place-items:center}
  .ns-check.hot{border-color:var(--hot)}
  .ns-check svg{width:14px;height:14px;color:#fff;opacity:0}
  .ns-b{flex:1;min-width:0}
  .ns-what{font-size:16px;line-height:1.3;display:block}
  .ns-due{font-size:13px;font-weight:600;color:var(--cool);margin-top:3px;display:block}
  .ns-due.hot{color:var(--hot)}

  /* compose sheet */
  .cw{position:absolute;inset:0;z-index:55;display:none}
  .cw.on{display:block}
  .cw-scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:.25s}
  .cw.on .cw-scrim{opacity:1}
  .compose{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
  .cw.on .compose{transform:none}
  .compose .grab{width:38px;height:5px;border-radius:3px;background:#cfc9bc;margin:6px auto 12px}
  .compose h3{font-size:17px;font-weight:600;text-align:center;margin-bottom:12px}
  .compose textarea{width:100%;border:none;background:var(--card);border-radius:12px;padding:14px;font:inherit;font-size:16px;min-height:96px;resize:none;outline:none;margin-bottom:12px}
  .compose .frow{display:flex;align-items:center;background:var(--card);border-radius:12px;padding:13px 16px;margin-bottom:2px}
  .compose .frow + .frow{margin-top:2px}
  .compose .frow span{flex:1;font-size:16px}
  .compose .datewrap{display:none;padding:13px 16px;background:var(--card);border-radius:12px;margin-top:2px;align-items:center}
  .compose .datewrap.on{display:flex}
  .compose .datewrap input{border:none;background:none;font:inherit;font-size:16px;flex:1;outline:none;color:var(--tint)}
  .compose .save{width:100%;margin-top:14px;height:50px;border-radius:13px;background:var(--tint);color:#fff;font-size:17px;font-weight:600}

  .toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(14px);background:rgba(30,30,32,.95);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.22s;z-index:50;display:flex;align-items:center;gap:8px;max-width:88%}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .toast svg{width:17px;height:17px;color:#4cd964;flex:none}

  /* ── Sign-out badge, injected by the gate as fixed bottom-right ──────
     There it sat on top of the floating dock, covering the Map tab and the
     Add button. Repositioned here only — the gate's auth logic, markup and
     class names are untouched. Mobile: top-right of the large-title area.
     Desktop: into the left nav rail (see the desktop block below). */
  .phone #roosterAuthBadge{
    position:absolute;z-index:6;
    top:calc(env(safe-area-inset-top) + 10px);right:12px;bottom:auto;left:auto;
    background:var(--card);border:1px solid var(--sep-soft);
    box-shadow:none;backdrop-filter:none;
  }
  /* On a phone the badge is right-anchored in the same band as the large
     title. With the email shown it is ~152px wide, which collides with
     "Contractors" (text runs to ~210px) on a 360px screen and clears by
     only 1px at 375px. Drop to the button alone here; the rail has room
     for the address on desktop. */
  .phone #roosterAuthBadge .rooster-badge-email{display:none}

  /* ═══════════════ DESKTOP (≥900px) — master-detail, intentional ═══════════════ */
  @media(min-width:900px){
    body{background:#e6e8eb}
    .phone{max-width:1180px;height:100dvh;display:grid;
      grid-template-columns:220px 388px 1fr;grid-template-rows:auto 1fr;
      overflow:hidden;box-shadow:0 0 0 1px var(--sep-soft)}
    .phone[data-tab="map"]{grid-template-columns:220px 1fr}

    /* left nav rail (from the floating dock) */
    .dock{position:static;grid-column:1;grid-row:1 / span 2;flex-direction:column;align-items:stretch;
      gap:4px;padding:20px 12px;border-right:1px solid var(--sep-soft);background:var(--surface-2);pointer-events:auto}
    .dock::before{content:"Rounds";display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;padding:2px 12px 16px}
    .tabbar{flex-direction:column;flex:none;gap:2px;padding:0;border-radius:0;background:none;backdrop-filter:none;box-shadow:none}
    .tabbar button{flex-direction:row;justify-content:flex-start;gap:13px;padding:11px 13px;border-radius:11px}
    .tabbar svg{width:22px;height:22px}
    .tabbar span{font-size:15px;font-weight:500}
    .tabbar button[aria-selected="true"]{background:var(--tint-fill);color:var(--tint)}
    .fab-glass{order:-1;width:auto;height:auto;flex:none;border-radius:12px;padding:12px 14px;margin-bottom:10px;
      justify-content:flex-start;gap:11px;background:var(--tint);color:#fff;box-shadow:none;backdrop-filter:none}
    .fab-glass svg{width:20px;height:20px}
    .fab-glass::after{content:"Add contractor";font-size:15px;font-weight:600}
    .fab-glass.hide{display:flex;opacity:1;transform:none}

    /* middle: large title + scrolling list */
    .navbar#nav-main{grid-column:2;grid-row:1;border-bottom:1px solid var(--sep-soft);padding-top:22px}
    .large{padding-bottom:14px}
    .scroll{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;padding-bottom:24px;border-right:1px solid var(--sep-soft)}
    .phone[data-tab="map"] .scroll{border-right:none}
    /* chip bars & groups sit a touch tighter in the narrower column */
    .idx{display:none} /* A–Z rail is a mobile touch affordance; desktop scrolls/searches */

    /* right: detail pane, always present */
    .detail#detail{grid-column:3;grid-row:1 / span 2;position:static;transform:none !important;display:flex;height:auto;min-height:0}
    .phone[data-tab="map"] .detail#detail{display:none}
    .detail .navbar{position:sticky;top:0;z-index:3}
    .nb-back{display:none}                 /* master-detail: list is always visible */
    .d-scroll{min-height:0}
    .cell.selected,.cell[aria-current="true"]{background:var(--tint-fill)}

    /* edit overlays the detail column only */
    #edit{grid-column:3;grid-row:1 / span 2;position:static;transform:none !important;display:none;flex-direction:column}
    #edit.on{display:flex}

    /* empty state for the detail pane */
    .d-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
      text-align:center;color:var(--label3);padding:40px;gap:6px}
    .d-empty svg{width:52px;height:52px;color:var(--sep);margin-bottom:8px}
    .d-empty .t{font-size:18px;font-weight:600;color:var(--label)}
    .d-empty .s{font-size:14px;color:var(--label2);max-width:280px;line-height:1.4}

    /* bottom sheets → centered modals on desktop */
    .compose{left:50%;right:auto;transform:translate(-50%,20px);width:440px;border-radius:18px;bottom:auto;top:50%;margin-top:-160px}
    .cw.on .compose{transform:translate(-50%,-50%)}
    .as{left:50%;right:auto;transform:translateX(-50%) translateY(20px);width:340px;bottom:auto;top:50%;margin-top:-160px}
    .as-wrap.on .as{transform:translateX(-50%)}
  
    /* Sign-out becomes the last item in the rail's flex column, so it
       inherits the rail's own width and padding instead of being placed by
       hand — the rail's box is narrower than its grid column, so absolute
       coordinates stuck out on both sides. margin-top:auto floats it to
       the foot, clear of the tabs. */
    .dock #roosterAuthBadge{position:static;margin-top:auto;width:auto;
      top:auto;right:auto;bottom:auto;left:auto;justify-content:space-between}
    .dock #roosterAuthBadge .rooster-badge-email{display:block;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  }
  .d-empty{display:none}
</style>

<body>

      <div style="margin:14px 16px;height:280px;border-radius:14px;overflow:hidden;position:relative;background:
        repeating-linear-gradient(0deg,transparent 0 41px,#e3e3e8 41px 42px),

  <!-- ===== DETAIL (push) ===== -->

  <!-- ===== FLOATING GLASS DOCK ===== -->

    <nav class="tabbar" role="tablist">
      <button role="tab" aria-selected="true" id="tab-today" onclick="show('today')"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9h17M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></svg><span>Today</span></button>
      <button role="tab" aria-selected="false" id="tab-contractors" onclick="show('contractors')"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M5 20a7 7 0 0114 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Contractors</span></button>
      <button role="tab" aria-selected="false" id="tab-map" onclick="show('map')"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4zM9 4v13M15 6.5v13" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Map</span></button>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   DATA LAYER — Supabase. Replaces the demo cordon.
   Reads/writes go through the gate's client (window.roosterAuth.client());
   no second client is created. Initial load fires on `rooster:authed`.
   Shapes below match what the render functions consume, unchanged.
   ═══════════════════════════════════════════════════════════════════════ */
/* ===== TERRITORY: two-table lookup, exactly like the sheet ===== */
const RALEIGH_ZIPS={
  '27601':'RALEIGH-S','27605':'RALEIGH-S','27603':'RALEIGH-S','27606':'RALEIGH-S','27610':'RALEIGH-S','27529':'RALEIGH-S',
  '27604':'RALEIGH-N','27608':'RALEIGH-N','27609':'RALEIGH-N','27612':'RALEIGH-N','27613':'RALEIGH-N','27614':'RALEIGH-N','27615':'RALEIGH-N','27616':'RALEIGH-N','27617':'RALEIGH-N','27618':'RALEIGH-N',
  '27607':'WEST'
};
const CITY_TERR={
  'CARY':'WEST','APEX':'WEST','MORRISVILLE':'WEST','NEW HILL':'WEST',
  'FUQUAY VARINA':'SOUTH','FUQUAY-VARINA':'SOUTH','HOLLY SPRINGS':'SOUTH','WILLOW SPRING':'SOUTH','LILLINGTON':'SOUTH',
  'WAKE FOREST':'NORTH','YOUNGSVILLE':'NORTH','ROLESVILLE':'NORTH','FRANKLINTON':'NORTH',
  'GARNER':'SOUTHEAST','CLAYTON':'SOUTHEAST','ANGIER':'SOUTHEAST','BENSON':'SOUTHEAST','COATS':'SOUTHEAST','SMITHFIELD':'SOUTHEAST',
  'LOUISBURG':'FAR NORTH','CREEDMOOR':'FAR NORTH','HENDERSON':'FAR NORTH','KITTRELL':'FAR NORTH','BUNN':'FAR NORTH',
  'WENDELL':'EAST','ZEBULON':'EAST','KNIGHTDALE':'EAST','MIDDLESEX':'EAST',
  'DURHAM':'DURHAM','CHAPEL HILL':'DURHAM','PITTSBORO':'DURHAM','MONCURE':'DURHAM','HILLSBOROUGH':'DURHAM',
  'SANFORD':'SANFORD'
};
const TERR_ORDER=['RALEIGH-N','RALEIGH-S','NORTH','SOUTH','SOUTHEAST','EAST','FAR NORTH','WEST','DURHAM','SANFORD','RALEIGH-UNASSIGNED','OUT OF RANGE'];
function addrBits(addr){
  // Parse by comma segments, not loose regex. Two traps this avoids:
  //   - a bare \d{5} match grabs PO Box / street numbers ("PO BOX 12061")
  //   - a lazy city match ate "MO" out of "MONCURE" because the NC in
  //     MO-NC-URE satisfied the state token.
  const out={city:'',state:'',zip:null};
  if(!addr) return out;
  const parts=String(addr).split(',').map(x=>x.trim()).filter(Boolean);
  let si=-1;
  for(let i=parts.length-1;i>=0;i--){
    const m=parts[i].match(/^([A-Za-z]{2})(?:\s+(\d{5}))?(?:-\d{4})?$/);
    if(m){si=i;out.state=m[1].toUpperCase();if(m[2])out.zip=m[2];break;}
  }
  if(si>0) out.city=parts[si-1].toUpperCase();
  if(si===-1){
    // No "ST" / "ST 12345" segment — try "CITY ST ZIP" in the last segment.
    const tail=parts[parts.length-1]||'';
    const m=tail.match(/^(.+?)\s+([A-Za-z]{2})\s+(\d{5})(?:-\d{4})?$/);
    if(m){out.city=m[1].trim().toUpperCase();out.state=m[2].toUpperCase();out.zip=m[3];}
    else if(parts.length>=2) out.city=parts[parts.length-2].toUpperCase();
  }
  // Zip always comes from the LAST 5-digit run, never the first.
  if(!out.zip){const zs=String(addr).match(/\b\d{5}\b/g); if(zs) out.zip=zs[zs.length-1];}
  return out;
}
function deriveTerritory(addr){
  if(!addr) return 'OUT OF RANGE';
  const b=addrBits(addr);
  // The lookup tables are NC-only. An out-of-state address that happens to
  // share an NC city name (CLAYTON, GA) is not in the rotation.
  if(b.state && b.state!=='NC') return 'OUT OF RANGE';
  // Raleigh is zip-driven; a Raleigh address whose zip isn't in the table is
  // RALEIGH-UNASSIGNED (a known-city gap), not OUT OF RANGE (unknown city).
  if(b.city==='RALEIGH') return (b.zip&&RALEIGH_ZIPS[b.zip])?RALEIGH_ZIPS[b.zip]:'RALEIGH-UNASSIGNED';
  if(CITY_TERR[b.city]) return CITY_TERR[b.city];
  if(b.zip&&RALEIGH_ZIPS[b.zip]) return RALEIGH_ZIPS[b.zip];
  return 'OUT OF RANGE';
}



/* ---- state (same names/shapes the renders expect) ---- */
let contractors=[], byId={}, attention=[], due=[], recent=[], roster=[];
let AREAS=['All areas'];
let nextSteps=[], history=[];
let currentOwnerId=null, dataLoaded=false, loadErr=null, openId=null;
let TODAY=new Date();

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function sbClient(){
  if(!window.roosterAuth||typeof window.roosterAuth.client!=='function')
    throw new Error('auth gate not loaded — no Supabase client');
  return window.roosterAuth.client();
}

/* ---- status math. last_visited NULL = calm start: never overdue ---- */
const DAYMS=86400000;
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function daysSince(lv){return lv?Math.round((dayStart(TODAY)-dayStart(lv))/DAYMS):null;}
function overdueOf(c){const ds=daysSince(c.lastVisit);return ds===null?null:ds-c.freq;}
function heatOf(o){if(o===null)return'cool';return o>7?'hot':o>=0?'due':'cool';}
function sortKey(c){const o=overdueOf(c);return o===null?-1e9:o;}
function readoutOf(o){
  if(o===null)return{d:'—',l:'not visited'};
  if(o>0)return{d:'+'+o+'d',l:'over'};
  if(o===0)return{d:'today',l:'due'};
  return{d:'−'+Math.abs(o)+'d',l:'left'};
}
function cadenceWord(n){return({7:'weekly',14:'every 2 wks',21:'every 3 wks',30:'monthly',45:'every 6 wks',60:'every 2 months',90:'quarterly'})[n]||('every '+n+' days');}
function lastTouchWord(c){const d=daysSince(c.lastVisit);return d===null?'never':d===0?'today':d===1?'yesterday':d+'d ago';}
function metaOf(c){
  const cad=cadenceWord(c.freq);
  return c.contact ? esc(c.contact)+' · '+cad : cad+' · last touch '+lastTouchWord(c);
}
function humanWhen(dt){
  const ms=TODAY-dt, h=Math.floor(ms/3600000), d=Math.round((dayStart(TODAY)-dayStart(dt))/DAYMS);
  if(d===0)return h<1?'Just now':h+'h ago';
  if(d===1)return'Yesterday';
  if(d<7)return d+'d ago';
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function humanDue(ds){
  if(!ds)return{when:'No date',late:false};
  const due=new Date(ds+'T00:00'), diff=Math.round((dayStart(due)-dayStart(TODAY))/DAYMS);
  if(diff===0)return{when:'Today',late:false};
  if(diff<0)return{when:Math.abs(diff)+'d late',late:true};
  if(diff===1)return{when:'Tomorrow',late:false};
  return{when:due.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),late:false};
}
function addrString(r){
  const tail=[r.state,r.zip].filter(Boolean).join(' ');
  return [r.street_address,r.city,tail].filter(Boolean).join(', ');
}
function parseAddr(addr){
  const out={street_address:'',city:'',state:'NC',zip:''};
  if(!addr)return out;
  const b=addrBits(addr);
  if(b.zip)out.zip=b.zip;
  if(b.state)out.state=b.state;
  const parts=addr.split(',').map(x=>x.trim()).filter(Boolean);
  if(parts[0])out.street_address=parts[0];
  if(b.city)out.city=b.city;
  return out;
}
function rowToC(r){
  const lat=r.lat==null?null:Number(r.lat), lng=r.lng==null?null:Number(r.lng);
  return {
    id:r.id, name:r.company||'(unnamed)', contact:(r.contact||'').trim(),
    phone:r.phone||'', addr:addrString(r), territory:r.territory||'OUT OF RANGE',
    freq:r.target_days||60,
    lastVisit:r.last_visited?new Date(r.last_visited+'T09:00:00'):null,
    churned:r.status==='churned', callOnly:(r.visitable||'VISIT')==='CALL ONLY',
    starred:!!r.starred,
    lat:Number.isFinite(lat)?lat:null, lng:Number.isFinite(lng)?lng:null
  };
}

/* ---- load everything, then paint ---- */
async function loadAll(){
  loadErr=null;
  try{
    const sb=sbClient();
    const {data:{user}}=await sb.auth.getUser();
    currentOwnerId=user?user.id:null;
    const [cR,vR,uR]=await Promise.all([
      sb.from('contractors').select('*').order('company',{ascending:true}),
      sb.from('visits').select('*').order('visited_on',{ascending:false}),
      sb.from('updates').select('*,contractors(company)').order('created_at',{ascending:false})
    ]);
    if(cR.error)throw cR.error; if(vR.error)throw vR.error; if(uR.error)throw uR.error;
    TODAY=new Date();
    contractors=(cR.data||[]).map(rowToC);
    byId={}; contractors.forEach(c=>byId[c.id]=c);
    allVisits=vR.data||[]; allUpdates=uR.data||[];

    /* due[] — active accounts, worst first; calm start sorts last */
    due=contractors.filter(c=>!c.churned).sort((a,b)=>sortKey(b)-sortKey(a)).map(c=>{
      const o=overdueOf(c), r=readoutOf(o);
      return {id:c.id,name:c.name,terr:c.territory,meta:metaOf(c),d:r.d,l:r.l,heat:heatOf(o),call:c.callOnly};
    });

    /* attention[] — open follow-ups across all accounts, soonest first */
    attention=allUpdates.filter(u=>u.is_followup&&!u.done_at)
      .sort((a,b)=>(a.due_date||'9999-12-31').localeCompare(b.due_date||'9999-12-31'))
      .map(u=>{const h=humanDue(u.due_date);
        return {id:u.id,cid:u.contractor_id,who:(u.contractors&&u.contractors.company)||(byId[u.contractor_id]||{}).name||'—',
                what:u.note||'Follow up',when:h.when,late:h.late};});

    /* recent[] — newest visits + notes across the book */
    recent=allVisits.map(v=>({kind:'visit',cid:v.contractor_id,when:new Date(v.visited_on+'T09:00:00'),
        what:'Visit — <b>'+esc((byId[v.contractor_id]||{}).name||'—')+'</b>'}))
      .concat(allUpdates.filter(u=>!u.is_followup).map(u=>({kind:'note',cid:u.contractor_id,when:new Date(u.created_at),
        what:'Note — <b>'+esc((u.contractors&&u.contractors.company)||(byId[u.contractor_id]||{}).name||'—')+'</b>'})))
      .sort((a,b)=>b.when-a.when).slice(0,6)
      .map(r=>({kind:r.kind,cid:r.cid,what:r.what,when:humanWhen(r.when)}));

    /* roster[] — [name,terr,contact,heat,readout,call,id,label] */
    roster=contractors.map(c=>{
      const o=overdueOf(c), r=readoutOf(o);

    const present=new Set(contractors.filter(c=>!c.churned).map(c=>c.territory));

  composeMode=mode||'note';

  } else {
    document.getElementById('composeTitle').textContent=asFollowup?'New next step':'Add note';

  if(composeMode!=='visit')document.getElementById('composeTitle').textContent=on?'New next step':'Add note';}
function closeCompose(){cw.classList.remove('on');}
function saveCompose(){
  const txt=document.getElementById('composeText').value.trim();
  const isFu=document.getElementById('fuToggle').getAttribute('aria-pressed')==='true';
  const fuDate=document.getElementById('fuDate').value||null;
  const cid=openId;
  if(!cid){toast('No account open');return;}

  if(composeMode==='visit'){
    const today=dayStart(new Date()).toISOString().slice(0,10);   // local date, not UTC
    closeCompose();
    mutate(async()=>{
      await insVisit(cid,today,txt);                              // visit + resets the clock
      if(isFu)await insFollowup(cid,txt||'Follow up',fuDate);
    }, isFu?'Visit logged + next step added':'Visit logged — clock reset');
    return;
  }
  if(!txt){document.getElementById('composeText').focus();return;}
  closeCompose();
  if(isFu) mutate(()=>insFollowup(cid,txt,fuDate),'Next step added — shows in Today');
  else     mutate(()=>insNote(cid,txt),'Note added');
}

  const src = isNew?null:(byId[openId]||null);
  editingId = src?src.id:null;
  editFreq = src?src.freq:60;
  const c = src?{name:src.name,contact:src.contact,phone:src.phone,addr:src.addr,area:src.territory,call:src.callOnly}
               :{name:'',contact:'',phone:'',addr:'',area:'—',call:false};
  editBody.innerHTML=`
    <div class="ghead">Name</div>
    <div class="group"><div class="field"><input id="eName" placeholder="Business name" value="${esc(c.name)}"></div></div>

    <div class="ghead">Primary contact</div>
    <div class="group">
      <div class="field"><label>Contact</label><input id="eContact" placeholder="Name (optional)" value="${esc(c.contact||'')}"></div>
      <div class="field"><label>Phone</label><input id="ePhone" inputmode="tel" placeholder="(919) 555-0000" value="${esc(c.phone||'')}"></div>
    </div>

    <div class="ghead">Location</div>
    <div class="group">
      <div class="field"><label>Address</label><input id="eAddr" placeholder="Start typing…" value="${esc(c.addr||'')}" oninput="editArea(this.value)"></div>
      <div class="field"><label>Area</label><span class="auto-area" id="editAreaVal">${c.area||'—'}</span><span class="aux">Auto</span></div>
    </div>
    <div style="font-size:13px;color:var(--label2);padding:6px 16px 0">Type an address and pick a match — we fill the area, ZIP, and map pin for you.</div>

    <div class="ghead">Visit type</div>
    <div class="group"><div class="field"><label style="width:auto;flex:1">Call only (never drive here)</label><button class="switch" id="eCall" aria-pressed="${c.call}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')==='true'?'false':'true')"></button></div></div>

    <div class="ghead">Visit every</div>
    <div class="group"><div class="field"><label style="width:auto;flex:1">How often</label>
      <div class="stepper"><button onclick="bumpEditFreq(-1)">−</button><div class="v" id="eFreqVal">${cadenceWord(editFreq)}<small>${editFreq} days</small></div><button onclick="bumpEditFreq(1)">+</button></div></div></div>

    ${isNew?'':`<div class="ghead">Rotation</div>
    <div class="group"><button class="destructive" onclick="markChurned()">Mark as churned</button></div>`}
    <div style="height:28px"></div>`;
  edit.classList.add('on');fabHide(true);
}
function editArea(v){
  // the real two-table lookup — same deriveTerritory the 418 rows were built with
  const b=addrBits(v);
  const el=document.getElementById('editAreaVal');
  if(el)el.textContent=(v&&(b.state||b.zip))?deriveTerritory(v):'—';
}
function bumpEditFreq(dir){
  let i=FREQS.indexOf(editFreq); if(i<0)i=FREQS.findIndex(f=>f>=editFreq); if(i<0)i=FREQS.length-1;
  i=Math.min(FREQS.length-1,Math.max(0,i+dir)); editFreq=FREQS[i];
  const el=document.getElementById('eFreqVal');
  if(el)el.innerHTML=`${cadenceWord(editFreq)}<small>${editFreq} days</small>`;
}
function markChurned(){
  if(!editingId)return;
  closeEdit();
  mutate(()=>setStatus(editingId,true),'Marked churned');
}
function closeEdit(){edit.classList.remove('on');fabHide(false);}
function saveEdit(){
  const name=(document.getElementById('eName').value||'').trim();
  if(!name){document.getElementById('eName').focus();toast('Add a business name');return;}
  const addr=(document.getElementById('eAddr').value||'').trim();
  const a=parseAddr(addr);
  const payload={
    company:name,
    contact:(document.getElementById('eContact').value||'').trim()||null,
    phone:(document.getElementById('ePhone').value||'').trim()||null,
    street_address:a.street_address||null, city:a.city||null, state:a.state||'NC', zip:a.zip||null,
    territory:deriveTerritory(addr),                 // derived, never the typed value
    visitable:document.getElementById('eCall').getAttribute('aria-pressed')==='true'?'CALL ONLY':'VISIT',
    target_days:editFreq
  };
  const id=editingId;
  closeEdit();
  mutate(async()=>{
    const sb=sbClient();
    if(id){
      const r=await sb.from('contractors').update(payload).eq('id',id);
      if(r.error)throw r.error;
    }else{
      if(!currentOwnerId)throw new Error('no signed-in user');
      const r=await sb.from('contractors')
        .insert(Object.assign({},payload,{owner_id:currentOwnerId,starred:false,last_visited:null,status:'active'}))
        .select('id').single();
      if(r.error)throw r.error;
      openId=r.data.id;
    }
  }, id?'Saved':(name+' added · '+payload.territory));
}

function openAreas(){}function closeAreas(){asWrap.classList.remove('on');}
function closeAreas(){asWrap.classList.remove('on');}

const isDesktop=()=>matchMedia('(min-width:900px)').matches;
function detailPlaceholder(){
  document.getElementById('detailBody').innerHTML=`<div class="d-empty">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20a7 7 0 0114 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div class="t">Select a contractor</div><div class="s">Pick someone from the list to see their history, next steps, and log a visit.</div>
  </div>`;
}
function show(v){
  current=v;closeEdit();
  document.querySelector('.phone').dataset.tab=v;
  ['today','contractors','map'].forEach(x=>{document.getElementById('s-'+x).classList.toggle('on',x===v);document.getElementById('tab-'+x).setAttribute('aria-selected',x===v);});
  scroll.scrollTop=0;
  const T={today:['Today',todaySub()],contractors:['Contractors',bookSub()],map:['Territory map','See your book by area']};
  largeTitle.childNodes[0].nodeValue=T[v][0];largeSub.textContent=T[v][1];
  openId=null;                                     // tab change clears the selection
  if(isDesktop()){detail.classList.remove('on');detailPlaceholder();markCurrent();} else {closeDetail();}
}
function fabHide(h){document.getElementById('fab').classList.toggle('hide',h);}
let tt;function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1700);}

document.querySelector('.phone').dataset.tab='today';
/* Shell paints immediately with loading states; real data arrives on the
   gate's `rooster:authed` event so every query carries a JWT. Both
   breakpoints call the same renders, so wiring once covers both. */
paintAll();
if(isDesktop())detailPlaceholder();
/* The gate appends its badge to <body>. Move it inside .phone so the rules
   above can place it; CSS does the positioning at each width. */
function placeAuthBadge(){
  const b=document.getElementById('roosterAuthBadge'); if(!b)return;
  // desktop: last child of the nav rail. mobile: top-right of the shell.
  const host=isDesktop()?document.querySelector('.dock'):document.querySelector('.phone');
  if(host&&b.parentElement!==host)host.appendChild(b);
}
window.addEventListener('resize',placeAuthBadge);
document.addEventListener('rooster:authed',function(){ placeAuthBadge(); loadAll(); });
setTimeout(placeAuthBadge,600);   // safety net if the badge lands late
</script>
</body>
</html>
