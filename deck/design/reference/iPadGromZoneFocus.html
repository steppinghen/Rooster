<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Deck — Grom Zone in focus mode</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F4EBD9}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; background: #1C1A33; color: #F4EBD9; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px; padding: 40px 56px 56px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 14px">
<div style="font-family: 'Archivo Black', sans-serif; font-size: 34px; letter-spacing: 0.5px">GROM ZONE</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 2px solid #3A3660; border-radius: 999px; font-size: 13px; font-weight: 700; color: #BDB5D6"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Focus mode</div>
</div>
<div style="width: 60px; height: 60px; border-radius: 50%; background: #2A2748; border: 3px solid #FF3E8A; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 24px">B</div>
</div>

<div style="background: #F4EBD9; color: #15122E; border: 3px solid #0A0818; border-radius: 28px; box-shadow: 0 6px 0 #0A0818; padding: 44px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center">
<div style="width: 120px; height: 120px; border-radius: 50%; background: #FFFFFF; border: 3px solid #0A0818; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; line-height: 1.25; padding: 10px; box-sizing: border-box">TURTLE<br>(calm pose)</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 52px; line-height: 1">Session time</h1>
<div style="font-size: 20px; font-weight: 600; color: #4A4568">Chores will be here when you're done.</div>
</div>
<button style="width: 100%; min-height: 110px; background: #15122E; color: #F4EBD9; border: 3px solid #0A0818; border-radius: 24px; box-shadow: 0 7px 0 #0A0818; font-family: 'Archivo Black', sans-serif; font-size: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 16px"><svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"></path></svg>Start Session</button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 16px; font-weight: 700; color: #8D86B3">Later</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<button disabled style="min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #24213F; color: #8D86B3; border: 3px solid #2F2B52; border-radius: 22px; font-size: 18px; font-weight: 700"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 6 0 0 1 16 0z"></path><path d="M20 13h2M5 15l-1 3M19 15l1 3M9 15l-.5 3M15 15l.5 3"></path></svg>Feed the turtle</button>
<button disabled style="min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #24213F; color: #8D86B3; border: 3px solid #2F2B52; border-radius: 22px; font-size: 18px; font-weight: 700"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10l2 4v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8z"></path><path d="M5 8h14M9 12h6"></path></svg>Toys away</button>
<button disabled style="min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #24213F; color: #8D86B3; border: 3px solid #2F2B52; border-radius: 22px; font-size: 18px; font-weight: 700"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M10 9.5v5l4.5-2.5z"></path></svg>Coop TV</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kidColor":{"editor":"color","default":"#FF3E8A","options":["#FF3E8A","#29D3FF","#FFD23F","#9BE564"]},"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { kidColor: this.props.kidColor ?? '#FF3E8A' };
  }
}
</script>
</body>
</html>
