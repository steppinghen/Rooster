<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Deck — Wave Check</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700;800&amp;family=Permanent+Marker&amp;display=swap">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; background-color: #15122E; background-image: radial-gradient(rgba(244,235,217,0.08) 1.2px, transparent 1.7px); background-size: 10px 10px; color: #F4EBD9; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 30px; padding: 40px 44px 48px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Permanent Marker', cursive; font-size: 22px; color: #FFD23F; transform: rotate(-2deg); align-self: flex-start">After school</div>
<div style="font-family: 'Archivo Black', sans-serif; font-size: 64px; line-height: 0.95; letter-spacing: -1px; text-shadow: 4px 0 0 #FF3E8A, -4px 0 0 #29D3FF">WAVE CHECK</div>
</div>
<div style="width: 72px; height: 72px; border-radius: 50%; background: #FF3E8A; border: 4px solid #0A0818; box-shadow: 4px 4px 0 #0A0818; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 30px; color: #15122E">B</div>
</div>

<div style="display: flex; align-items: center; gap: 22px">
<div style="width: 170px; height: 170px; flex-shrink: 0; border-radius: 50%; background: #F4EBD9; border: 5px solid #0A0818; box-shadow: 6px 6px 0 #0A0818; display: flex; align-items: center; justify-content: center; text-align: center; color: #15122E; font-size: 13px; font-weight: 800; line-height: 1.3; padding: 18px; box-sizing: border-box; transform: rotate(-4deg)">ROOSTER MASCOT<br>Fluent Emoji 3D</div>
<div style="flex-grow: 1; background: #F4EBD9; color: #15122E; border: 4px solid #0A0818; border-radius: 26px 26px 26px 6px; box-shadow: 5px 5px 0 #0A0818; padding: 22px 26px; display: flex; align-items: center; gap: 16px">
<div style="flex-grow: 1; font-family: 'Archivo Black', sans-serif; font-size: 36px; line-height: 1">How's your wave today?</div>
<button aria-label="Hear the question" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%; background: #15122E; color: #F4EBD9; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg></button>
</div>
</div>

<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 24px">

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FFD23F; color: #15122E; border: 4px solid #0A0818; border-radius: 28px; box-shadow: 0 9px 0 #0A0818; cursor: pointer; transform: rotate(-1.5deg)">
<svg width="120" height="120" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><circle cx="17" cy="20" r="1.8" fill="currentColor"></circle><circle cx="31" cy="20" r="1.8" fill="currentColor"></circle><path d="M14 27c3 7 17 7 20 0z"></path></svg>
<div style="font-family: 'Archivo Black', sans-serif; font-size: 36px">Pumping!</div>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #29D3FF; color: #15122E; border: 4px solid #0A0818; border-radius: 28px; box-shadow: 0 9px 0 #0A0818; cursor: pointer; transform: rotate(1.2deg)">
<svg width="120" height="120" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><circle cx="17" cy="20" r="1.8" fill="currentColor"></circle><circle cx="31" cy="20" r="1.8" fill="currentColor"></circle><path d="M16 30c4 2 12 2 16 0"></path></svg>
<div style="font-family: 'Archivo Black', sans-serif; font-size: 36px">Rolling</div>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #A99BFF; color: #15122E; border: 4px solid #0A0818; border-radius: 28px; box-shadow: 0 9px 0 #0A0818; cursor: pointer; transform: rotate(1deg)">
<svg width="120" height="120" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><circle cx="17" cy="21" r="1.8" fill="currentColor"></circle><circle cx="31" cy="21" r="1.8" fill="currentColor"></circle><path d="M16 33c4-4 12-4 16 0"></path></svg>
<div style="font-family: 'Archivo Black', sans-serif; font-size: 36px">Flat</div>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FF8A3D; color: #15122E; border: 4px solid #0A0818; border-radius: 28px; box-shadow: 0 9px 0 #0A0818; cursor: pointer; transform: rotate(-1deg)">
<svg width="120" height="120" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><path d="M13 16l7 3M35 16l-7 3"></path><circle cx="17" cy="22" r="1.8" fill="currentColor"></circle><circle cx="31" cy="22" r="1.8" fill="currentColor"></circle><path d="M15 33l3-2 3 2 3-2 3 2 3-2 3 2"></path></svg>
<div style="font-family: 'Archivo Black', sans-serif; font-size: 36px">Choppy</div>
</button>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kidColor":{"editor":"color","default":"#FF3E8A","options":["#FF3E8A","#29D3FF","#FFD23F","#9BE564"]},"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { kidColor: this.props.kidColor ?? '#FF3E8A' };
  }
}
</script>
</body>
</html>
