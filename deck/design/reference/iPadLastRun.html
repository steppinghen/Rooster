<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Deck — Last Run wind-down</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F4EBD9}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; background: #141228; color: #F4EBD9; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px; padding: 40px 56px 56px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#BDB5D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"></path></svg>
<div style="font-family: 'Archivo Black', sans-serif; font-size: 34px; letter-spacing: 0.5px">LAST RUN</div>
</div>
<div style="width: 60px; height: 60px; border-radius: 50%; background: #221F3D; border: 3px solid #FF3E8A; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 24px">B</div>
</div>

<div style="display: flex; align-items: center; gap: 22px">
<div style="width: 104px; height: 104px; flex-shrink: 0; border-radius: 50%; background: #2A2748; border: 3px solid #0A0818; display: flex; align-items: center; justify-content: center; text-align: center; color: #BDB5D6; font-size: 11px; font-weight: 800; line-height: 1.25; padding: 10px; box-sizing: border-box">ROOSTER<br>(sleepy pose)</div>
<div style="flex-grow: 1; display: flex; align-items: center; gap: 16px">
<h1 style="margin: 0; flex-grow: 1; font-family: 'Archivo Black', sans-serif; font-size: 40px; line-height: 1.05">How was your day?</h1>
<button aria-label="Hear the question" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%; background: #2A2748; color: #F4EBD9; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<button style="min-height: 150px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: #221F3D; color: #F4EBD9; border: 3px solid #2F2B52; border-radius: 24px; font-size: 26px; font-weight: 800; cursor: pointer"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#FFD23F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><circle cx="17" cy="20" r="1.8" fill="#FFD23F"></circle><circle cx="31" cy="20" r="1.8" fill="#FFD23F"></circle><path d="M14 27c3 7 17 7 20 0z"></path></svg>Pumping</button>
<button style="min-height: 150px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: #221F3D; color: #F4EBD9; border: 3px solid #2F2B52; border-radius: 24px; font-size: 26px; font-weight: 800; cursor: pointer"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#29D3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><circle cx="17" cy="20" r="1.8" fill="#29D3FF"></circle><circle cx="31" cy="20" r="1.8" fill="#29D3FF"></circle><path d="M16 30c4 2 12 2 16 0"></path></svg>Rolling</button>
<button style="min-height: 150px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: #221F3D; color: #F4EBD9; border: 3px solid #2F2B52; border-radius: 24px; font-size: 26px; font-weight: 800; cursor: pointer"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#A99BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><circle cx="17" cy="21" r="1.8" fill="#A99BFF"></circle><circle cx="31" cy="21" r="1.8" fill="#A99BFF"></circle><path d="M16 33c4-4 12-4 16 0"></path></svg>Flat</button>
<button style="min-height: 150px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: #221F3D; color: #F4EBD9; border: 3px solid #2F2B52; border-radius: 24px; font-size: 26px; font-weight: 800; cursor: pointer"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"></circle><path d="M13 16l7 3M35 16l-7 3"></path><circle cx="17" cy="22" r="1.8" fill="#FF8A3D"></circle><circle cx="31" cy="22" r="1.8" fill="#FF8A3D"></circle><path d="M15 33l3-2 3 2 3-2 3 2 3-2 3 2"></path></svg>Choppy</button>
</div>

<div style="flex-grow: 1; background: #F4EBD9; color: #15122E; border: 3px solid #0A0818; border-radius: 28px; box-shadow: 0 6px 0 #0A0818; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">
<div style="font-family: 'Archivo Black', sans-serif; font-size: 26px">Then</div>
<div style="display: flex; align-items: center; gap: 20px; min-height: 80px; border-bottom: 2px solid #D9CCB2"><div style="width: 52px; height: 52px; border-radius: 50%; background: #15122E; color: #F4EBD9; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div><div style="font-size: 26px; font-weight: 700; color: #4A4568; text-decoration: line-through">Brush teeth</div></div>
<div style="display: flex; align-items: center; gap: 20px; min-height: 80px; border-bottom: 2px solid #D9CCB2"><div style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #15122E; box-sizing: border-box"></div><div style="font-size: 26px; font-weight: 800">Two books</div></div>
<div style="display: flex; align-items: center; gap: 20px; min-height: 80px"><div style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #15122E; box-sizing: border-box"></div><div style="font-size: 26px; font-weight: 800">Lights out</div></div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kidColor":{"editor":"color","default":"#FF3E8A","options":["#FF3E8A","#29D3FF","#FFD23F","#9BE564"]},"$preview":{"width":820,"height":1180}}'>

  renderVals() {
    return { kidColor: this.props.kidColor ?? '#FF3E8A' };
  }
}
</script>
</body>
</html>
