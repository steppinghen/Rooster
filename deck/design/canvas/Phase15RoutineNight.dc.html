class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: { bathtub: true, toothbrush: true } }; }
  renderVals() {
    const base = [
      { key: 'bathtub', label: 'Bath' },
      { key: 'pjs', label: 'PJs' },
      { key: 'toothbrush', label: 'Teeth' },
      { key: 'books', label: 'Story' },
      { key: 'bed', label: 'Bed' }
    ];
    const done = this.state.done;
    const nextKey = (base.find(s => !done[s.key]) || {}).key;
    const steps = base.map(s => ({ ...s, isPJ: s.key === 'pjs', notPJ: s.key !== 'pjs',
      isDone: !!done[s.key], isNext: s.key === nextKey, isTodo: !done[s.key] && s.key !== nextKey,
      toggle: () => this.setState({ done: { ...this.state.done, [s.key]: !this.state.done[s.key] } })
    }));
    const doneCount = steps.filter(s => s.isDone).length;
    return { kidColor: this.props.kidColor ?? '#FF3E8A', steps, doneCount, total: steps.length,
      bar: steps.map((s, i) => ({ on: i < doneCount, off: i >= doneCount })) };
  }
}
