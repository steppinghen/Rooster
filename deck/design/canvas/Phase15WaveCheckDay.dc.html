<script type="text/x-dc" data-dc-script data-props='{"kidColor": {"editor": "color", "default": "#29D3FF", "options": ["#29D3FF", "#FF3E8A", "#FFD23F", "#9BE564"]}, "season": {"editor": "enum", "default": "Fall", "options": ["Spring / summer", "Fall", "Winter"]}, "$preview": {"width": 820, "height": 1180}}'>
class Component extends DCLogic {
  renderVals() {
    const v = Object.assign({}, this._rv());
    const season = { 'Spring / summer': 'sun', 'Fall': 'fall', 'Winter': 'winter' }[this.props.season ?? 'Fall'] || 'sun';
    v.c_sun = season === 'sun'; v.c_fall = season === 'fall'; v.c_winter = season === 'winter';
    v.faces = (v.faces || []).map((f) => Object.assign({}, f, { sP: f.id === 'pumping', sR: f.id === 'rolling', sF: f.id === 'flat', sC: f.id === 'choppy' }));
    return v;
  }
  constructor(p) { super(p); this.state = { picked: 'choppy', size: 2 }; }
  _rv() {
    const F = [
      { id: 'pumping', word: 'Happy', surf: 'PUMPING', key: 'grinning_face_with_big_eyes', color: '#FFD23F', tilt: -1.5 },
      { id: 'rolling', word: 'Okay', surf: 'ROLLING', key: 'slightly_smiling_face', color: '#29D3FF', tilt: 1.2 },
      { id: 'flat', word: 'Sad', surf: 'FLAT', key: 'pensive_face', color: '#A99BFF', tilt: 1 },
      { id: 'choppy', word: 'Upset', surf: 'CHOPPY', key: 'angry_face', color: '#FF8A3D', tilt: -1.2 }
    ];
    const picked = this.state.picked, cur = F.find(f => f.id === picked);
    const faces = F.map(f => ({ ...f, on: f.id === picked, dim: !!picked && f.id !== picked, idle: !picked,
      pick: () => this.setState({ picked: f.id === this.state.picked ? null : f.id }) }));
    const W = { pumping: ['a little happy', 'happy', 'super happy'], flat: ['a little sad', 'sad', 'really sad'],
      choppy: ['a little upset', 'upset', 'really upset'] }[picked];
    const sizes = W ? [1, 2, 3].map(n => ({ n, label: W[n - 1],
      on: this.state.size === n, off: this.state.size !== n, pick: () => this.setState({ size: n }) })) : [];
    return { kidColor: this.props.kidColor ?? '#29D3FF', faces, sizes, hasPick: !!picked, noPick: !picked, hasSizes: !!W, noSizes: !!picked && !W,
      curColor: cur ? cur.color : '#FFFBF2', curWord: cur ? cur.word.toLowerCase() : '' };
  }
}
