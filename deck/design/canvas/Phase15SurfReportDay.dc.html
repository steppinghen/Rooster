<script type="text/x-dc" data-dc-script data-props='{"weather": {"editor": "enum", "default": "Rain", "options": ["Sunny", "Cloudy", "Rain", "Storm", "Windy", "Hot", "Cold"]}, "season": {"editor": "enum", "default": "Fall", "options": ["Spring / summer", "Fall", "Winter"]}, "kidColor": {"editor": "color", "default": "#29D3FF", "options": ["#29D3FF", "#FF3E8A", "#FFD23F", "#9BE564"]}, "$preview": {"width": 820, "height": 1180}}'>

const COND = {
  'Sunny':  { temp: 72, word: 'Sunny',  feel: 'Warm',  later: ['Sunny', 'Sunny', 'Cloudy'] },
  'Cloudy': { temp: 64, word: 'Cloudy', feel: 'Mild',  later: ['Cloudy', 'Cloudy', 'Cloudy'] },
  'Rain':   { temp: 58, word: 'Rain',   feel: 'Cool',  later: ['Cloudy', 'Rain', 'Rain'] },
  'Storm':  { temp: 66, word: 'Storms', feel: 'Mild',  later: ['Cloudy', 'Storm', 'Rain'] },
  'Windy':  { temp: 54, word: 'Windy',  feel: 'Cool',  later: ['Windy', 'Windy', 'Cloudy'] },
  'Hot':    { temp: 91, word: 'Hot',    feel: 'Hot',   later: ['Sunny', 'Hot', 'Hot'] },
  'Cold':   { temp: 34, word: 'Cold',   feel: 'Cold',  later: ['Cold', 'Cloudy', 'Cold'] }
};
// temperature picks the layers, the sky adds rain gear
function hintsFor(c) {
  const t = COND[c].temp, out = [];
  if (t >= 75) out.push('Shorts');
  else if (t < 45) out.push('Coat', 'Warm hat');
  else if (t < 65) out.push('Jacket');
  if (t < 35) out.push('Gloves');
  if (c === 'Rain' || c === 'Storm') { if (!out.includes('Jacket') && !out.includes('Coat')) out.push('Jacket'); out.push('Rain boots'); }
  if (c === 'Windy' && !out.includes('Jacket') && !out.includes('Coat')) out.push('Jacket');
  return out;
}
const key = (p, s) => p + s.toLowerCase().replace(/[^a-z]/g, '');
function flags(p, names, s) { const o = {}; names.forEach((n) => { o[key(p, n)] = n === s; }); return o; }

function tipFor(c) {
  const d = COND[c], t = d.temp, wet = (x) => x === 'Rain' || x === 'Storm';
  const laterWet = d.later.slice(1).some(wet), nowWet = wet(d.later[0]) || c === 'Storm';
  if (nowWet) return { text: 'Wear your rain coat and rain boots', sub: 'Rain all day', pics: ['Jacket', 'Rain boots'] };
  if (laterWet) return { text: 'Bring a rain coat', sub: 'Rain after school', pics: ['Jacket'] };
  if (t < 35) return { text: 'Wear a heavy jacket, hat and gloves', sub: 'Freezing today', pics: ['Coat', 'Warm hat', 'Gloves'] };
  if (t < 45) return { text: 'Wear a heavy jacket', sub: 'Cold all day', pics: ['Coat'] };
  if (c === 'Windy') return { text: 'Bring a jacket', sub: 'Windy and cool', pics: ['Jacket'] };
  if (t < 65) return { text: 'Bring a jacket', sub: 'Cool this morning', pics: ['Jacket'] };
  if (t >= 85) return { text: 'Shorts, not pants, today', sub: 'Hot! Bring water too.', pics: ['Shorts'] };
  if (t >= 75) return { text: 'Shorts, not pants, today', sub: 'Warm all day', pics: ['Shorts'] };
  return { text: 'No jacket needed', sub: 'Nice all day', pics: [] };
}
const CONDS = ['Sunny', 'Cloudy', 'Rain', 'Storm', 'Windy', 'Hot', 'Cold'];
const HINTS = ['Jacket', 'Shorts', 'Rain boots', 'Coat', 'Warm hat', 'Gloves'];

class Component extends DCLogic {
  renderVals() {
    const c = this.props.weather ?? 'Rain', d = COND[c] || COND.Rain;
    const season = { 'Spring / summer': 'sun', 'Fall': 'fall', 'Winter': 'winter' }[this.props.season ?? 'Fall'] || 'sun';
    const when = ['Morning', 'After school', 'Evening'];
    const tip = tipFor(c);
    return Object.assign({ kidColor: this.props.kidColor ?? '#29D3FF', word: d.word, temp: d.temp, feel: d.feel,
      c_sun: season === 'sun', c_fall: season === 'fall', c_winter: season === 'winter',
      later: d.later.map((x, n) => Object.assign({ when: when[n] }, flags('s', CONDS, x))),
      tipText: tip.text, tipSub: tip.sub, tipPics: tip.pics.map((h) => Object.assign({ size: tip.pics.length > 2 ? 110 : 150 }, flags('h', HINTS, h))) }, flags('b', CONDS, c));
  }
}
</script>
