<div style="display: flex; align-items: center; gap: 18px; position: relative">

<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; position: relative">

<sc-if value="{{s.isNext}}" hint-placeholder-val="{{false}}">
<div style="flex: 1.5 1 0; min-height: 0; position: relative; display: flex; align-items: center; gap: 22px; padding: 0 22px 0 18px; background: {{kidColor}}; border: 5px solid #0A0818; border-radius: 28px; box-shadow: 0 10px 0 #0A0818; transform: rotate(-0.8deg)">
<div style="position: absolute; top: -16px; left: 28px; font-family: 'Permanent Marker', cursive; font-size: 18px; background: #FFD23F; color: #15122E; border: 3px solid #0A0818; padding: 1px 12px; transform: rotate(-3deg)">UP NEXT</div>
<span class="fx stk fx-{{s.key}}" role="img" aria-label="{{s.label}}" style="width: 118px; height: 118px; transform: rotate(-6deg)"></span>
<div style="flex-grow: 1; font-family: 'Archivo Black', sans-serif; font-size: 46px; line-height: 0.98">{{s.label}}</div>
<button aria-label="Hear it" style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%; background: #FFFBF2; color: #15122E; border: 4px solid #0A0818; box-shadow: 0 5px 0 #0A0818; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"></path></svg></button>
<button onClick="{{s.toggle}}" aria-label="Mark done" style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 50%; background: #15122E; color: #FFFBF2; border: 5px solid #0A0818; box-shadow: 0 7px 0 #0A0818; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{s.isTodo}}" hint-placeholder-val="{{true}}">
<button onClick="{{s.toggle}}" style="flex: 1 1 0; min-height: 0; display: flex; align-items: center; gap: 22px; padding: 0 26px 0 22px; background: #FFFBF2; color: #15122E; border: 4px solid #0A0818; border-radius: 24px; box-shadow: 0 6px 0 #0A0818; cursor: pointer; text-align: left">
<span class="fx stk fx-{{s.key}}" role="img" aria-label="" style="width: 80px; height: 80px; transform: rotate({{s.tilt}}deg)"></span>
<span style="flex-grow: 1; font-family: 'Archivo Black', sans-serif; font-size: 32px">{{s.label}}</span>
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; border: 4px dashed #7A7298; box-sizing: border-box"></span>
</button>
</sc-if>

<sc-if value="{{s.isDone}}" hint-placeholder-val="{{false}}">
<button onClick="{{s.toggle}}" aria-label="{{s.label}}, done. Tap to undo." style="flex: 1 1 0; min-height: 0; display: flex; align-items: center; gap: 22px; padding: 0 26px 0 22px; background: #EDE4D1; color: #4E4870; border: 4px solid #0A0818; border-radius: 24px; box-shadow: 0 3px 0 #0A0818; cursor: pointer; text-align: left; transform: translateY(3px)">
<span class="fx stk fx-{{s.key}}" role="img" aria-label="" style="width: 80px; height: 80px; opacity: 0.55; transform: rotate({{s.tilt}}deg)"></span>
<span style="flex-grow: 1; font-family: 'Archivo Black', sans-serif; font-size: 32px">{{s.label}}</span>
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; background: #9BE564; color: #15122E; border: 4px solid #0A0818; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>

</div>

<script type="text/x-dc" data-dc-script data-props='{"kidColor": {"editor": "color", "default": "#29D3FF", "options": ["#29D3FF", "#FF3E8A", "#FFD23F", "#9BE564"]}, "finishBy": {"editor": "enum", "default": "plenty", "options": ["off", "plenty", "hurry", "last call", "time up"]}, "leaveBy": {"editor": "enum", "default": "bus", "options": ["bus", "car"]}, "season": {"editor": "enum", "default": "Fall", "options": ["Spring / summer", "Fall", "Winter"]}, "$preview": {"width": 820, "height": 1180}}'>
class Component extends DCLogic {
  renderVals() {
    const v = Object.assign({}, this._rv());
    const season = { 'Spring / summer': 'sun', 'Fall': 'fall', 'Winter': 'winter' }[this.props.season ?? 'Fall'] || 'sun';
    v.c_sun = season === 'sun'; v.c_fall = season === 'fall'; v.c_winter = season === 'winter';
    return v;
  }
  constructor(p) { super(p); this.state = { done: { bed: true, 't-shirt': true, toothbrush: true } }; }
  _rv() {
    const base = [
      { key: 'bed', label: 'Make your bed', tilt: -5 },
      { key: 't-shirt', label: 'Get dressed', tilt: 4 },
      { key: 'bowl_with_spoon', label: 'Eat breakfast', tilt: -3 },
      { key: 'toothbrush', label: 'Brush teeth', tilt: 6 },
      { key: 'running_shoe', label: 'Shoes on', tilt: -4 },
      { key: 'backpack', label: 'Pack your backpack', tilt: 3 }
    ];
    const done = this.state.done;
    const nextKey = (base.find(s => !done[s.key]) || {}).key;
    const steps = base.map(s => ({ ...s,
      isDone: !!done[s.key], isNext: s.key === nextKey, isTodo: !done[s.key] && s.key !== nextKey,
      toggle: () => this.setState({ done: { ...this.state.done, [s.key]: !this.state.done[s.key] } })
    }));
    const doneCount = steps.filter(s => s.isDone).length;
    const fb = this.props.finishBy ?? 'plenty', car = (this.props.leaveBy ?? 'bus') === 'car';
    const where = car ? 'Car leaves at 7:50' : 'Bus at 8:00';
    const T = {
      'plenty':    { min: 18, big: '18 min left', bg: '#FFFBF2', fg: '#15122E', tag: '' },
      'hurry':     { min: 9,  big: '9 min left',  bg: '#FFD23F', fg: '#15122E', tag: 'Pick up the pace' },
      'last call': { min: 4,  big: '4 min left!', bg: '#FF8A3D', fg: '#15122E', tag: 'LAST CALL', rooster: true },
      'time up':   { min: 0,  big: car ? 'Car time. Let’s go!' : 'Bus time. Let’s go!', bg: '#15122E', fg: '#FFFBF2', tag: '' }
    }[fb] || {};
    const C = 138.23, frac = Math.min(1, (T.min || 0) / 30);
    const t = { ...T, show: fb !== 'off', bus: !car, car, small: where, dash: (frac * C).toFixed(1) + ' ' + C };
    return {
      t,
      kidColor: this.props.kidColor ?? '#29D3FF',
      steps, doneCount, total: steps.length,
      bar: steps.map((s, i) => ({ on: i < doneCount, off: i >= doneCount }))
    };
  }
}
</script>
