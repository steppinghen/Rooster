<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My week — My stickers collection (Kid A, night, landscape)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700;800&amp;family=Permanent+Marker&amp;display=swap">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27A}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.fx{background-image:url(/_blob/e47a0dc8fefa526e06b4d92fd86fbb16);background-size:1000% 900%;background-repeat:no-repeat;display:block;flex-shrink:0}
.fx-shark{background-position:0.0000% 75.0000%}
.fx-rocket{background-position:33.3333% 62.5000%}
.fx-fire{background-position:66.6667% 25.0000%}
.fx-rainbow{background-position:0.0000% 62.5000%}
.fx-dolphin{background-position:33.3333% 25.0000%}
.fx-call_me_hand{background-position:22.2222% 12.5000%}
.fx-octopus{background-position:33.3333% 50.0000%}
.fx-sparkles{background-position:11.1111% 87.5000%}
.fx-rooster{background-position:55.5556% 62.5000%}
.fx-house{background-position:88.8889% 37.5000%}
.fx-sun{background-position:44.4444% 87.5000%}
.fx-crescent_moon{background-position:0.0000% 25.0000%}
.fx-backpack{background-position:33.3333% 0.0000%}
.fx-star{background-position:33.3333% 87.5000%}
.fx-glowing_star{background-position:11.1111% 37.5000%}
.fx-crab{background-position:100.0000% 12.5000%}
.stk{filter:drop-shadow(3px 0 0 #FFFBF2) drop-shadow(-3px 0 0 #FFFBF2) drop-shadow(0 3px 0 #FFFBF2) drop-shadow(0 -3px 0 #FFFBF2) drop-shadow(1.5px 0 0 #0A0818) drop-shadow(-1.5px 0 0 #0A0818) drop-shadow(0 1.5px 0 #0A0818) drop-shadow(0 -1.5px 0 #0A0818) drop-shadow(3px 3px 0 #0A0818)}
.stk-s{filter:drop-shadow(1.75px 0 0 #FFFBF2) drop-shadow(-1.75px 0 0 #FFFBF2) drop-shadow(0 1.75px 0 #FFFBF2) drop-shadow(0 -1.75px 0 #FFFBF2) drop-shadow(1px 0 0 #0A0818) drop-shadow(-1px 0 0 #0A0818) drop-shadow(0 1px 0 #0A0818) drop-shadow(0 -1px 0 #0A0818) drop-shadow(2px 2px 0 #0A0818)}
.fx-fox{background-position:77.7778% 25.0000%}
.fx-sponge{background-position:22.2222% 87.5000%}
.fx-t_rex{background-position:88.8889% 87.5000%}
.fx-sauropod{background-position:77.7778% 62.5000%}
.fx-tropical_fish{background-position:44.4444% 100.0000%}
.fx-alien_monster{background-position:11.1111% 0.0000%}
.fx-shooting_star{background-position:11.1111% 75.0000%}
.fx-jack_o_lantern{background-position:0.0000% 50.0000%}
.fx-ghost{background-position:100.0000% 25.0000%}
.fx-school{background-position:100.0000% 62.5000%}
.fx-books{background-position:0.0000% 12.5000%}
.fx-skateboard{background-position:33.3333% 75.0000%}
.fx-snowman{background-position:77.7778% 75.0000%}
.fx-palm_tree{background-position:55.5556% 50.0000%}
.fx-fox{background-position:77.7778% 25.0000%}
</style>
</helmet>
<div style="{{rootStyle}}">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{normal}}" hint-placeholder-val="{{true}}"><div style="font-family: 'Permanent Marker', cursive; font-size: 21px; color: #FFD23F; transform: rotate(-2deg); align-self: flex-start">{{countLine}}</div></sc-if>
<sc-if value="{{focus}}" hint-placeholder-val="{{false}}"><div style="font-size: 18px; font-weight: 800; color: #BDB5D6">{{countLine}}</div></sc-if>
<h1 style="{{h1Style}}">MY STICKERS</h1>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<a href="Phase15MyWeek.dc.html" style="height: 72px; padding: 0 22px 0 16px; display: flex; align-items: center; gap: 10px; background: #F4EBD9; color: #15122E; border: 4px solid #0A0818; border-radius: 24px; box-shadow: 0 6px 0 #0A0818; text-decoration: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg><span style="font-family: 'Archivo Black', sans-serif; font-size: 22px">This week</span></a>
<a href="Phase15MyLookDay.dc.html" aria-label="My look" style="width: 72px; height: 72px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; background: #29D3FF; border: 4px solid #0A0818; box-shadow: 4px 4px 0 #0A0818; display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="fx stk fx-fox" style="width: 47px; height: 47px"></span></a>
</div>
</div>

<div role="radiogroup" aria-label="Sticker sets" style="display: flex; gap: 10px; flex-wrap: wrap">
<sc-for list="{{sets}}" as="f" hint-placeholder-count="6"><button onClick="{{f.pick}}" role="radio" aria-checked="{{f.aria}}" aria-label="{{f.label}}" style="{{f.style}}"><span class="{{f.cls}}" style="{{f.iconStyle}}"></span><sc-if value="{{f.showLabel}}" hint-placeholder-val="{{true}}"><span>{{f.label}}</span></sc-if></button></sc-for>
</div>

<div style="{{gridStyle}}">
<sc-for list="{{tiles}}" as="s" hint-placeholder-count="14">
<button onClick="{{s.open}}" aria-label="{{s.aria}}" style="{{s.style}}">
<sc-if value="{{s.isNew}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -10px; left: -6px; padding: 2px 8px; background: #FFD23F; color: #15122E; border: 3px solid #0A0818; border-radius: 10px; font-size: 13px; font-weight: 800; transform: rotate(-6deg)">NEW</span></sc-if>
<span class="{{s.cls}}" style="{{s.iconStyle}}"></span>
<sc-if value="{{s.showName}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 800; line-height: 1.1">{{s.name}}</span></sc-if>
<sc-if value="{{s.multi}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; right: 8px; padding: 1px 7px; background: #F4EBD9; color: #15122E; border: 2px solid #0A0818; border-radius: 9px; font-size: 13px; font-weight: 800">{{s.count}}</span></sc-if>
</button>
</sc-for>
</div>

<sc-if value="{{openOn}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 3; background: rgba(10,8,24,0.62); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="{{oName}}" style="width: 520px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 28px 28px; background: #221E45; border: 4px solid #0A0818; border-radius: 32px; box-shadow: 0 9px 0 #0A0818">
<span class="{{oCls}}" style="{{oIconStyle}}"></span>
<span style="font-family: 'Archivo Black', sans-serif; font-size: 36px; line-height: 1">{{oName}}</span>
<span style="font-size: 18px; font-weight: 800; color: #BDB5D6; text-align: center">{{oWhen}}</span>
<div style="display: flex; gap: 14px">
<button aria-label="Hear it" style="width: 68px; height: 68px; border-radius: 50%; background: #FFFBF2; color: #15122E; border: 4px solid #0A0818; box-shadow: 0 5px 0 #0A0818; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"></path></svg></button>
<button onClick="{{close}}" style="height: 68px; padding: 0 30px; border-radius: 999px; background: #29D3FF; color: #15122E; border: 4px solid #0A0818; box-shadow: 0 5px 0 #0A0818; font-family: 'Archivo Black', sans-serif; font-size: 22px; cursor: pointer">Done</button>
</div>
</div>
</div>
</sc-if>

<nav aria-label="The Deck" style="position: relative; z-index: 1; flex-shrink: 0; margin: 0 -40px; display: flex; gap: 6px; padding: 12px 20px 22px; background: #15122E; border-top: 5px solid #0A0818"><a href="Phase15PointB2.dc.html" aria-label="Home" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span style="font-size: 14px; font-weight: 800">Home</span></a><a href="Phase15MyWeek.dc.html" aria-label="My week" aria-current="page" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: {{kidColor}}; color: #15122E; border: 3px solid #0A0818"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="4"></rect><circle cx="7" cy="18.5" r="1.4"></circle><circle cx="17" cy="18.5" r="1.4"></circle></svg><span style="font-size: 14px; font-weight: 800">My week</span></a><a href="Phase15WaveCheckDay.dc.html" aria-label="Wave Check" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M7 11c0-4 3-7 7-7 0 2-1 3-3 3"></path></svg><span style="font-size: 14px; font-weight: 800">Wave Check</span></a><a href="#" aria-label="Session" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"></path></svg><span style="font-size: 14px; font-weight: 800">Session</span></a><a href="#" aria-label="Coop TV" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M8 2l4 4 4-4"></path></svg><span style="font-size: 14px; font-weight: 800">Coop TV</span></a><a href="#" aria-label="Tune Shop" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><span class="fx stk-s fx-sponge" style="width: 34px; height: 34px"></span><span style="font-size: 14px; font-weight: 800">Tune Shop</span></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kid": {"editor": "enum", "default": "Reader", "options": ["Reader", "Pre-reader"]}, "volume": {"editor": "enum", "default": "Normal", "options": ["Normal", "Focus"]}, "$preview": {"width": 1180, "height": 820}}'>
const SETS = [['all', 'All', 'sparkles'], ['sea', 'Sea', 'dolphin'], ['dino', 'Dinos', 't_rex'], ['space', 'Space', 'rocket'], ['board', 'Boards', 'skateboard'], ['holiday', 'Holidays', 'jack_o_lantern'], ['school', 'School', 'school']];
const ST = [
  ['shark', 'Shark', 'sea', 2, 'Mon, Sep 28', false], ['dolphin', 'Dolphin', 'sea', 1, 'Wed, Sep 23', false], ['crab', 'Crab', 'sea', 1, 'Thu, Oct 1', true], ['tropical_fish', 'Tropical fish', 'sea', 3, 'Fri, Sep 18', false],
  ['t_rex', 'T. rex', 'dino', 1, 'Tue, Sep 29', false], ['sauropod', 'Long-neck', 'dino', 2, 'Mon, Sep 14', false],
  ['rocket', 'Rocket', 'space', 2, 'Sun, Sep 27', false], ['alien_monster', 'Space buddy', 'space', 1, 'Fri, Sep 11', false], ['shooting_star', 'Shooting star', 'space', 1, 'Wed, Sep 30', false],
  ['skateboard', 'Skate deck', 'board', 1, 'Sat, Sep 26', false], ['palm_tree', 'Palm tree', 'board', 1, 'Sat, Sep 19', false], ['snowman', 'Snow pal', 'board', 1, 'last winter', false],
  ['jack_o_lantern', 'Pumpkin', 'holiday', 1, 'Thu, Oct 1', true], ['ghost', 'Ghost', 'holiday', 1, 'last Halloween', false],
  ['school', 'Schoolhouse', 'school', 1, 'first day of school', false], ['books', 'Books', 'school', 1, 'Tue, Sep 15', false]
];
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const pre = this.props.kid === 'Pre-reader';
    const focus = this.props.volume === 'Focus';
    const f = s.set || 'all';
    const v = {};
    v.normal = !focus; v.focus = focus;
    const total = ST.reduce((a, x) => a + x[3], 0);
    v.countLine = total + ' stickers so far';
    v.rootStyle = 'width: 1180px; height: 820px; box-sizing: border-box; position: relative; color: #F4EBD9; font-family: \'Archivo\', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 30px 40px 0; overflow: hidden; '
      + (focus ? 'background: #1C1A33' : 'background-color: #15122E; background-image: radial-gradient(rgba(244,235,217,0.08) 1.2px, transparent 1.7px); background-size: 10px 10px');
    v.h1Style = "margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 54px; line-height: 0.95; letter-spacing: -1px; " + (focus ? '' : 'text-shadow: 4px 0 0 #29D3FF, -4px 0 0 #FF3E8A');
    const sets = pre ? SETS.filter((x) => x[0] !== 'board') : SETS;
    v.sets = sets.map(([id, label, icon]) => { const on = id === f; return { label, cls: 'fx stk fx-' + icon, showLabel: !pre, aria: on ? 'true' : 'false',
      iconStyle: 'width: ' + (pre ? 44 : 30) + 'px; height: ' + (pre ? 44 : 30) + 'px',
      style: 'height: ' + (pre ? 72 : 56) + 'px; ' + (pre ? 'width: 84px; justify-content: center; ' : 'padding: 0 18px 0 10px; ') + 'display: flex; align-items: center; gap: 8px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 800; border: 3px solid #0A0818; '
        + (on ? 'background: #29D3FF; color: #15122E; box-shadow: 0 2px 0 #0A0818' : 'background: #221E45; color: #F4EBD9; box-shadow: 0 4px 0 #0A0818'),
      pick: () => this.setState({ set: id }) }; });
    const list = ST.filter((x) => f === 'all' || x[2] === f);
    const cols = pre ? 5 : 8;
    v.gridStyle = 'flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(' + cols + ', minmax(0, 1fr)); grid-auto-rows: ' + (pre ? '170px' : '150px') + '; gap: ' + (pre ? '22px' : '18px') + '; align-content: start; overflow: hidden; padding: 10px 4px';
    const tilts = [-4, 3, -2, 5, -5, 2, -3, 4];
    v.tiles = list.slice(0, pre ? 10 : 16).map(([icon, name, set, count, when, isNew], n) => ({ name, count: '\u00d7' + count, multi: count > 1, isNew, showName: !pre,
      aria: name + (count > 1 ? ', ' + count + ' of them' : '') + (isNew ? ', new' : ''),
      cls: 'fx stk fx-' + icon, iconStyle: 'width: ' + (pre ? 96 : 76) + 'px; height: ' + (pre ? 96 : 76) + 'px',
      style: 'position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; border-radius: 24px; cursor: pointer; font-family: inherit; color: #F4EBD9; background: #221E45; border: 4px solid #0A0818; box-shadow: 0 6px 0 #0A0818; '
        + (focus ? '' : 'transform: rotate(' + tilts[n % 8] + 'deg)'),
      open: () => this.setState({ open: icon }) }));
    const o = ST.find((x) => x[0] === s.open);
    v.openOn = !!o; v.close = () => this.setState({ open: null });
    v.oName = o ? o[1] : ''; v.oCls = o ? 'fx stk fx-' + o[0] : 'fx'; v.oIconStyle = 'width: 180px; height: 180px; ' + (focus ? '' : 'transform: rotate(-5deg)');
    v.oWhen = o ? ('Got it ' + o[4] + (o[3] > 1 ? ' · you have ' + o[3] : '')) : '';
    return v;
  }
}
</script>
</body>
</html>
