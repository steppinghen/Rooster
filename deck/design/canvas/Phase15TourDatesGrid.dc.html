<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tour Dates — calendar grid (Kid A, night, normal, landscape)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700;800&amp;family=Permanent+Marker&amp;display=swap">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27A}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.fx{background-image:url(/_blob/e47a0dc8fefa526e06b4d92fd86fbb16);background-size:1000% 900%;background-repeat:no-repeat;display:block;flex-shrink:0}
.fx-beach_with_umbrella{background-position:66.6667% 0.0000%}
.fx-house{background-position:88.8889% 37.5000%}
.fx-ferris_wheel{background-position:55.5556% 25.0000%}
.fx-jack-o-lantern{background-position:0.0000% 50.0000%}
.fx-birthday_cake{background-position:100.0000% 0.0000%}
.fx-turkey{background-position:55.5556% 100.0000%}
.fx-christmas_tree{background-position:55.5556% 12.5000%}
.fx-airplane{background-position:0.0000% 0.0000%}
.fx-sun{background-position:44.4444% 87.5000%}
.fx-snowman{background-position:77.7778% 75.0000%}
.fx-sun_behind_small_cloud{background-position:66.6667% 87.5000%}
.fx-roller_coaster{background-position:44.4444% 62.5000%}
.fx-tent{background-position:0.0000% 100.0000%}
.fx-school{background-position:100.0000% 62.5000%}
.fx-sled{background-position:44.4444% 75.0000%}
.fx-party_popper{background-position:77.7778% 50.0000%}
.stk{filter:drop-shadow(3px 0 0 #FFFBF2) drop-shadow(-3px 0 0 #FFFBF2) drop-shadow(0 3px 0 #FFFBF2) drop-shadow(0 -3px 0 #FFFBF2) drop-shadow(1.5px 0 0 #0A0818) drop-shadow(-1.5px 0 0 #0A0818) drop-shadow(0 1.5px 0 #0A0818) drop-shadow(0 -1.5px 0 #0A0818) drop-shadow(3px 3px 0 #0A0818)}
.stk-s{filter:drop-shadow(1.75px 0 0 #FFFBF2) drop-shadow(-1.75px 0 0 #FFFBF2) drop-shadow(0 1.75px 0 #FFFBF2) drop-shadow(0 -1.75px 0 #FFFBF2) drop-shadow(1px 0 0 #0A0818) drop-shadow(-1px 0 0 #0A0818) drop-shadow(0 1px 0 #0A0818) drop-shadow(0 -1px 0 #0A0818) drop-shadow(2px 2px 0 #0A0818)}
.fx-fox{background-position:77.7778% 25.0000%}
.fx-sponge{background-position:22.2222% 87.5000%}
.fx-soccer_ball{background-position:100.0000% 75.0000%}
.fx-ghost{background-position:100.0000% 25.0000%}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background-color: #15122E; background-image: radial-gradient(rgba(244,235,217,0.08) 1.2px, transparent 1.7px); background-size: 10px 10px; color: #F4EBD9; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 32px 40px 0; overflow: hidden; position: relative">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Permanent Marker', cursive; font-size: 21px; color: #FFD23F; transform: rotate(-2deg); align-self: flex-start">Every day</div>
<h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 54px; line-height: 0.95; letter-spacing: -1px; text-shadow: 4px 0 0 #29D3FF, -4px 0 0 #FF3E8A">TOUR DATES</h1>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<nav aria-label="Tour Dates views" style="display: flex; gap: 8px"><a href="Phase15TourDatesDay.dc.html" style="width: 92px; height: 70px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; text-decoration: none; background: #221E45; color: #F4EBD9; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 3.5A9.5 9.5 0 1 0 20.5 17 7.5 7.5 0 0 1 19 3.5z"></path></svg><span style="font-size: 13px; font-weight: 800">Countdowns</span></a><a href="Phase15TourDatesNight.dc.html" style="width: 92px; height: 70px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; text-decoration: none; background: #221E45; color: #F4EBD9; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><rect x="3" y="11" width="18" height="4" rx="1.5"></rect><rect x="3" y="17" width="18" height="4" rx="1.5"></rect></svg><span style="font-size: 13px; font-weight: 800">Months</span></a><a href="Phase15TourDatesGrid.dc.html" aria-current="page" style="width: 92px; height: 70px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; text-decoration: none; background: {{kidColor}}; color: #15122E; border: 3px solid #0A0818; box-shadow: 0 2px 0 #0A0818"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><path d="M3 9.5h18M8 3v3M16 3v3M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"></path></svg><span style="font-size: 13px; font-weight: 800">Calendar</span></a></nav>
<a href="Phase15MyLookDay.dc.html" aria-label="My look" style="width: 72px; height: 72px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; background: {{kidColor}}; border: 4px solid #0A0818; box-shadow: 4px 4px 0 #0A0818; display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="fx stk fx-fox" style="width: 47px; height: 47px"></span></a>
</div>
</div>

<div style="display: flex; align-items: center; gap: 18px; margin-top: -4px">
<button aria-label="Back" aria-disabled="true" style="width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 50%; background: #221E45; color: #F4EBD9; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818; opacity: 0.4; cursor: default"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span class="fx stk fx-jack-o-lantern" aria-hidden="true" style="width: 48px; height: 48px; transform: rotate(-8deg)"></span>
<span style="font-family: 'Archivo Black', sans-serif; font-size: 34px; line-height: 1">October</span>
<button aria-label="Next month: November" style="width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 50%; background: #FFFBF2; color: #15122E; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>

<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px"><sc-for list="{{dow}}" as="w" hint-placeholder-count="7"><span style="padding-left: 8px; font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #BDB5D6">{{w.l}}</span></sc-for></div>
<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button onClick="{{c.open}}" aria-label="{{c.label}}" style="{{c.style}}">
<span style="{{c.numStyle}}">{{c.n}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px; align-items: center">
<sc-for list="{{c.stickers}}" as="s" hint-placeholder-count="1"><span class="{{s.cls}}" style="width: 34px; height: 34px"></span></sc-for>
</span>
<sc-for list="{{c.words}}" as="w" hint-placeholder-count="1"><span class="clip" style="max-width: 100%; font-size: 13px; font-weight: 800; color: #BDB5D6">{{w.t}}</span></sc-for>
</button>
</sc-for>
</div>
</div>

<sc-if value="{{dayOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 3; background: rgba(10,8,24,0.6); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="{{dayTitle}}" style="width: 560px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px 26px 26px; background: #221E45; border: 4px solid #0A0818; border-radius: 30px; box-shadow: 0 9px 0 #0A0818">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'Archivo Black', sans-serif; font-size: 32px; line-height: 1">{{dayTitle}}</span>
<span style="display: flex; gap: 10px">
<button aria-label="Hear it" style="width: 60px; height: 60px; border-radius: 50%; background: #FFFBF2; color: #15122E; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"></path></svg></button>
<button onClick="{{close}}" style="height: 60px; padding: 0 22px; border-radius: 999px; background: {{kidColor}}; color: #15122E; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">Done</button>
</span>
</div>
<sc-for list="{{dayItems}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: #2B2654; border: 3px solid #0A0818; border-radius: 18px">
<sc-if value="{{r.hasSticker}}" hint-placeholder-val="{{true}}"><span class="{{r.cls}}" style="width: 52px; height: 52px; transform: rotate(-4deg)"></span></sc-if>
<sc-if value="{{r.plain}}" hint-placeholder-val="{{false}}"><span style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: #BDB5D6">{{r.time}}</span></sc-if>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Archivo Black', sans-serif; font-size: 22px; line-height: 1.05">{{r.title}}</span><span style="font-size: 15px; font-weight: 800; color: #BDB5D6">{{r.sub}}</span></span>
</div>
</sc-for>
<sc-if value="{{dayEmpty}}" hint-placeholder-val="{{false}}"><span style="font-size: 18px; font-weight: 700; color: #BDB5D6">Nothing on this day yet.</span></sc-if>
</div>
</div>
</sc-if>

<nav aria-label="The Deck" style="position: relative; z-index: 1; flex-shrink: 0; margin: 0 -40px; display: flex; gap: 6px; padding: 12px 20px 22px; background: #15122E; border-top: 5px solid #0A0818"><a href="Phase15PointB2.dc.html" aria-label="Home" aria-current="page" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: {{kidColor}}; color: #15122E; border: 3px solid #0A0818"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span style="font-size: 14px; font-weight: 800">Home</span></a><a href="Phase15MyWeek.dc.html" aria-label="My week" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="4"></rect><circle cx="7" cy="18.5" r="1.4"></circle><circle cx="17" cy="18.5" r="1.4"></circle></svg><span style="font-size: 14px; font-weight: 800">My week</span></a><a href="Phase15WaveCheckDay.dc.html" aria-label="Wave Check" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M7 11c0-4 3-7 7-7 0 2-1 3-3 3"></path></svg><span style="font-size: 14px; font-weight: 800">Wave Check</span></a><a href="#" aria-label="Session" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"></path></svg><span style="font-size: 14px; font-weight: 800">Session</span></a><a href="#" aria-label="Coop TV" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M8 2l4 4 4-4"></path></svg><span style="font-size: 14px; font-weight: 800">Coop TV</span></a><a href="#" aria-label="Tune Shop" aria-current="false" style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 88px; box-sizing: border-box; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><span class="fx stk-s fx-sponge" style="width: 34px; height: 34px"></span><span style="font-size: 14px; font-weight: 800">Tune Shop</span></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kidColor":{"editor":"color","default":"#29D3FF","options":["#29D3FF","#FF3E8A","#FFD23F","#9BE564"]},"$preview":{"width":1180,"height":820}}'>
const START = 4;
const DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const EV = [
  { d: 2, title: 'Soccer', time: '5:30', icon: 'soccer_ball' },
  { d: 4, title: 'Grandma\u2019s house', icon: 'house' },
  { d: 7, title: 'Beach trip', icon: 'beach_with_umbrella' },
  { d: 9, title: 'Soccer', time: '5:30', icon: 'soccer_ball' },
  { d: 13, title: 'Fall festival', icon: 'ferris_wheel' },
  { d: 16, title: 'Soccer', time: '5:30', icon: 'soccer_ball' },
  { d: 20, title: 'Library day', time: '3:30' },
  { d: 23, title: 'No school', icon: 'school' },
  { d: 23, title: 'Soccer', time: '5:30', icon: 'soccer_ball' },
  { d: 27, title: 'Picture day', time: 'School' },
  { d: 30, title: 'Soccer', time: '5:30', icon: 'soccer_ball' },
  { d: 31, title: 'Halloween', icon: 'jack-o-lantern' },
  { d: 31, title: 'Trick-or-treat', time: '5:30', icon: 'ghost' }
];
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const kc = this.props.kidColor ?? '#29D3FF';
    const today = 2;
    const v = { kidColor: kc };
    v.dow = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((l) => ({ l }));
    v.cells = [];
    for (let i = 0; i < 35; i++) {
      const n = i - START + 1;
      const real = n >= 1 && n <= 31;
      const evs = real ? EV.filter((e) => e.d === n) : [];
      const past = real && n < today;
      v.cells.push({ n: real ? String(n) : '',
        label: real ? 'October ' + n + (evs.length ? ', ' + evs.map((e) => e.title).join(', ') : '') : 'No date',
        stickers: evs.filter((e) => e.icon).slice(0, 2).map((e) => ({ cls: 'fx stk-s fx-' + e.icon })),
        words: evs.filter((e) => !e.icon).slice(0, 1).map((e) => ({ t: e.title })),
        open: () => { if (real) this.setState({ day: n }); },
        style: !real ? 'background: transparent; border: 0; padding: 0' : ('min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 6px 8px; border-radius: 16px; overflow: hidden; text-align: left; cursor: pointer; font-family: inherit; color: #F4EBD9; '
          + (n === today ? 'background: ' + kc + '; border: 3px solid #0A0818; box-shadow: 0 4px 0 #0A0818' : 'background: #221E45; border: 3px solid #0A0818') + (past ? '; opacity: 0.55' : '')),
        numStyle: "font-family: 'Archivo Black', sans-serif; font-size: 22px; line-height: 1; color: " + (n === today ? '#15122E' : '#F4EBD9') });
    }
    const day = s.day || null;
    const dEv = day ? EV.filter((e) => e.d === day) : [];
    v.dayOpen = !!day; v.close = () => this.setState({ day: null });
    v.dayTitle = day ? (day === today ? 'Today' : DAYN[(START + day - 1) % 7] + ', October ' + day) : '';
    v.dayEmpty = !!day && dEv.length === 0;
    const sleeps = day ? day - today : 0;
    v.dayItems = dEv.map((e) => ({ title: e.title, hasSticker: !!e.icon, plain: !e.icon, cls: 'fx stk fx-' + (e.icon || 'house'), time: e.time || '',
      sub: (sleeps > 0 ? sleeps + (sleeps === 1 ? ' sleep' : ' sleeps') : (sleeps === 0 ? 'Today' : 'Already happened')) + (e.time && e.icon ? ' · ' + e.time : '') }));
    return v;
  }
}
</script>
