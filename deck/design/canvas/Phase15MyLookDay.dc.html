<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My look — Kid A picks an icon and color (day, normal, portrait)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700;800&amp;family=Permanent+Marker&amp;display=swap">
<style>
body{margin:0}
a{color:#B3124F}a:hover{color:#8A0D3C}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.fx{background-image:url(/_blob/e47a0dc8fefa526e06b4d92fd86fbb16);background-size:1000% 900%;background-repeat:no-repeat;display:block;flex-shrink:0}
.fx-fox{background-position:77.7778% 25.0000%}
.fx-lion{background-position:22.2222% 50.0000%}
.fx-owl{background-position:44.4444% 50.0000%}
.fx-cat_face{background-position:44.4444% 12.5000%}
.fx-frog{background-position:88.8889% 25.0000%}
.fx-unicorn{background-position:88.8889% 100.0000%}
.fx-t_rex{background-position:88.8889% 87.5000%}
.fx-sauropod{background-position:77.7778% 62.5000%}
.fx-shark{background-position:0.0000% 75.0000%}
.fx-dolphin{background-position:33.3333% 25.0000%}
.fx-octopus{background-position:33.3333% 50.0000%}
.fx-tropical_fish{background-position:44.4444% 100.0000%}
.fx-rocket{background-position:33.3333% 62.5000%}
.fx-alien_monster{background-position:11.1111% 0.0000%}
.fx-robot{background-position:22.2222% 62.5000%}
.fx-shooting_star{background-position:11.1111% 75.0000%}
.fx-guitar{background-position:33.3333% 37.5000%}
.fx-skateboard{background-position:33.3333% 75.0000%}
.stk{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(1.5px 0 0 #0A0818) drop-shadow(-1.5px 0 0 #0A0818) drop-shadow(0 1.5px 0 #0A0818) drop-shadow(0 -1.5px 0 #0A0818) drop-shadow(3px 3px 0 #0A0818)}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; position: relative; background-color: #F2E6CC; background-image: radial-gradient(rgba(10,8,24,0.09) 1.2px, transparent 1.7px); background-size: 10px 10px; color: #15122E; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 34px 40px 0; overflow: hidden">

<div aria-hidden="true" style="position: absolute; top: -170px; right: -150px; width: 400px; height: 400px; border-radius: 50%; background-color: #FF8A3D; background-image: radial-gradient(rgba(255,210,63,0.55) 2px, transparent 2.6px); background-size: 12px 12px; border: 5px solid #0A0818"></div>

<div style="display: flex; align-items: center; gap: 20px; position: relative">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Permanent Marker', cursive; font-size: 22px; color: #B3124F; transform: rotate(-2deg); align-self: flex-start">Make it yours, Kid A!</div>
<h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 60px; line-height: 0.95; letter-spacing: -1px; text-shadow: 4px 0 0 #29D3FF, -4px 0 0 #FF3E8A">MY LOOK</h1>
</div>
<div role="img" aria-label="Your avatar: {{iconName}}, {{colorName}}" style="width: 78px; height: 78px; flex-shrink: 0; border-radius: 50%; background: {{color}}; border: 4px solid #0A0818; box-shadow: 4px 4px 0 #0A0818; display: flex; align-items: center; justify-content: center"><span class="{{iconCls}}" style="width: 52px; height: 52px"></span></div>
</div>

<div style="position: relative; display: flex; align-items: center; gap: 30px; padding: 22px 28px; background: #FFFBF2; border: 5px solid #0A0818; border-radius: 30px; box-shadow: 0 9px 0 #0A0818; transform: rotate(-0.5deg)">
<div style="position: absolute; top: -15px; left: 26px; font-family: 'Permanent Marker', cursive; font-size: 17px; background: #FFD23F; border: 3px solid #0A0818; padding: 1px 12px; transform: rotate(-3deg)">THAT’S YOU</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div role="img" aria-label="Avatar preview" style="width: 140px; height: 140px; border-radius: 50%; background-color: {{color}}; background-image: radial-gradient(rgba(10,8,24,0.14) 1.6px, transparent 2.2px); background-size: 11px 11px; border: 5px solid #0A0818; box-shadow: 6px 6px 0 #0A0818; display: flex; align-items: center; justify-content: center"><span class="{{iconCls}}" style="width: 94px; height: 94px; transform: rotate(-6deg)"></span></div>
<span style="font-size: 16px; font-weight: 800; color: #4E4870">On every screen</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div role="img" aria-label="Your pro model deck" style="position: relative; width: 100%; height: 132px; border-radius: 66px; border: 4px solid #0A0818; box-shadow: 0 6px 0 #0A0818; box-sizing: border-box; transform: rotate(-3deg)">
<span style="position: absolute; inset: 0; border-radius: 62px; overflow: hidden"><span style="position: absolute; inset: 0; background: {{color}}"></span><span style="position: absolute; left: 0; right: 0; top: 41%; height: 18%; background: #0A0818"></span><span style="position: absolute; inset: 0; background-image: radial-gradient(rgba(10,8,24,0.16) 1.6px, transparent 2.2px); background-size: 11px 11px"></span></span>
<span style="position: absolute; left: 10.8%; top: 38%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 10.8%; top: 62%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 15.2%; top: 38%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 15.2%; top: 62%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 84.8%; top: 38%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 84.8%; top: 62%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 89.2%; top: 38%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span><span style="position: absolute; left: 89.2%; top: 62%; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: #0A0818; border: 2px solid #F4EBD9"></span>
<span style="position: absolute; left: 22%; top: 50%; transform: translateY(-50%) rotate(-4deg); font-family: 'Permanent Marker', cursive; font-size: 24px; color: #15122E; background: #FFFBF2; border: 3px solid #0A0818; padding: 0 10px; line-height: 1.3">Kid A</span>
<span class="{{iconCls}}" style="position: absolute; left: 66%; top: 50%; width: 86px; height: 86px; margin: -43px 0 0 -43px; transform: rotate(8deg)"></span>
</div>
<span style="font-size: 16px; font-weight: 800; color: #4E4870">Your pro model · Team Riders</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; position: relative">
<div style="display: flex; align-items: center; gap: 14px"><span style="font-family: 'Archivo Black', sans-serif; font-size: 26px">Your color</span><span style="flex-grow: 1; height: 4px; background: #0A0818; opacity: 0.15; border-radius: 2px"></span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" style="height: 116px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; padding: 6px 0 0; background: transparent; color: #15122E; border: 0; cursor: pointer">
<span style="{{c.dotStyle}}"><sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="font-size: 17px; font-weight: 800">{{c.name}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; position: relative">
<div style="display: flex; align-items: center; gap: 14px"><span style="font-family: 'Archivo Black', sans-serif; font-size: 26px">Your sticker</span><span style="flex-grow: 1; height: 4px; background: #0A0818; opacity: 0.15; border-radius: 2px"></span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="18">
<button onClick="{{i.pick}}" aria-label="{{i.name}}" aria-pressed="{{i.pressed}}" style="{{i.tileStyle}}">
<span class="{{i.cls}}" style="width: 54px; height: 54px"></span>
<span style="font-size: 15px; font-weight: 800; line-height: 1">{{i.name}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 18px; position: relative; margin-top: auto; padding-bottom: 4px">
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<button onClick="{{edit}}" style="flex-grow: 1; height: 88px; display: flex; align-items: center; justify-content: center; gap: 14px; background: {{color}}; color: #15122E; border: 4px solid #0A0818; border-radius: 24px; box-shadow: 0 7px 0 #0A0818; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: 30px"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Looking good!</button>
</sc-if>
<sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}">
<button onClick="{{save}}" style="flex-grow: 1; height: 88px; display: flex; align-items: center; justify-content: center; gap: 14px; background: #15122E; color: #FFFBF2; border: 4px solid #0A0818; border-radius: 24px; box-shadow: 0 7px 0 #0A0818; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: 30px">That’s me!<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg></button>
</sc-if>
</div>

<nav aria-label="The Deck" style="position: relative; z-index: 1; flex-shrink: 0; margin: 0 -40px; display: flex; justify-content: center; gap: 24px; padding: 12px 20px 22px; background: #15122E; border-top: 5px solid #0A0818"><a href="Phase15PointB2.dc.html" aria-label="Home" aria-current="page" style="width: 230px; height: 84px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 20px; text-decoration: none; background: {{color}}; color: #15122E; border: 3px solid #0A0818"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span style="font-size: 15px; font-weight: 800">Home</span></a><a href="Phase15WaveCheckDay.dc.html" aria-label="Wave Check" aria-current="false" style="width: 230px; height: 84px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 20px; text-decoration: none; background: transparent; color: #FFFBF2; border: 3px solid transparent"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M7 11c0-4 3-7 7-7 0 2-1 3-3 3"></path></svg><span style="font-size: 15px; font-weight: 800">Wave Check</span></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kidColor": {"editor": "color", "default": "#29D3FF", "options": ["#29D3FF", "#FF3E8A", "#FFD23F", "#9BE564"]}, "$preview": {"width": 820, "height": 1180}}'>
const COLORS = [{"hex": "#FF3E8A", "name": "Pink"}, {"hex": "#29D3FF", "name": "Blue"}, {"hex": "#FFD23F", "name": "Yellow"}, {"hex": "#9BE564", "name": "Green"}, {"hex": "#A99BFF", "name": "Purple"}, {"hex": "#FF8A3D", "name": "Orange"}];
const ICONS = [{"key": "fox", "name": "Fox"}, {"key": "lion", "name": "Lion"}, {"key": "owl", "name": "Owl"}, {"key": "cat_face", "name": "Cat"}, {"key": "frog", "name": "Frog"}, {"key": "unicorn", "name": "Unicorn"}, {"key": "t_rex", "name": "T. rex"}, {"key": "sauropod", "name": "Long-neck"}, {"key": "shark", "name": "Shark"}, {"key": "dolphin", "name": "Dolphin"}, {"key": "octopus", "name": "Octopus"}, {"key": "tropical_fish", "name": "Fish"}, {"key": "rocket", "name": "Rocket"}, {"key": "alien_monster", "name": "Alien"}, {"key": "robot", "name": "Robot"}, {"key": "shooting_star", "name": "Star"}, {"key": "guitar", "name": "Guitar"}, {"key": "skateboard", "name": "Skateboard"}];
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const color = s.color || this.props.kidColor || '#29D3FF';
    const icon = s.icon || 'fox';
    const saved = !!s.saved;
    const cName = (COLORS.find((c) => c.hex.toLowerCase() === String(color).toLowerCase()) || { name: 'Your color' }).name;
    const iName = (ICONS.find((i) => i.key === icon) || ICONS[0]).name;
    const colors = COLORS.map((c) => {
      const sel = c.hex.toLowerCase() === String(color).toLowerCase();
      return { ...c, sel, pressed: sel ? 'true' : 'false',
        dotStyle: 'width: 84px; height: 84px; box-sizing: border-box; border-radius: 50%; background: ' + c.hex + '; color: #0A0818; display: flex; align-items: center; justify-content: center; border: ' + (sel ? '6px' : '4px') + ' solid #0A0818; box-shadow: ' + (sel ? '0 0 0 5px #FFFBF2, 0 0 0 9px #0A0818' : '0 5px 0 #0A0818') + '; transform: ' + (sel ? 'translateY(-2px)' : 'none'),
        pick: () => this.setState({ color: c.hex, saved: false }) };
    });
    const icons = ICONS.map((it, n) => {
      const sel = it.key === icon;
      const tilt = [-4, 3, -2, 5, -3, 2][n % 6];
      return { ...it, sel, pressed: sel ? 'true' : 'false', cls: 'fx stk fx-' + it.key,
        tileStyle: 'height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0; color: #15122E; cursor: pointer; border-radius: 22px; background: ' + (sel ? color : '#FFFBF2') + '; border: ' + (sel ? '5px' : '3px') + ' solid #0A0818; box-shadow: ' + (sel ? '0 7px 0 #0A0818' : '0 4px 0 #0A0818') + '; transform: ' + (sel ? 'translateY(-3px) rotate(' + tilt + 'deg)' : 'none'),
        pick: () => this.setState({ icon: it.key, saved: false }) };
    });
    return { color, colorName: cName, iconName: iName, iconCls: 'fx stk fx-' + icon, colors, icons, saved, notSaved: !saved,
      save: () => this.setState({ saved: true }), edit: () => this.setState({ saved: false }) };
  }
}
</script>
</body>
</html>
